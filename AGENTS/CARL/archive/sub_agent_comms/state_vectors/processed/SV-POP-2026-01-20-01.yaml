    CONSUMER STRESS TRANSMISSION:
    This divergence represents the EARLY PHASE of the Owner Squeeze Cascade:
    1. Revenue stress has arrived (confirmed by SBCS)
    2. Owners are absorbing stress personally (cutting own pay, using savings)
    3. Optimistic sentiment persists (denial/hope phase)
    4. Employment cuts will follow sentiment shift by 3-6 months

    The consumer stress from small business is ALREADY occurring through owner personal finances—it won't appear in headline employment data until Q2-Q3 2026.

    THREE TRANSMISSION CASCADES ACTIVATING:
    - FLOW-POP-01 Owner Squeeze: Revenue decline confirmed; owner comp cuts next
    - FLOW-POP-02 Employment Transmission: Business stress confirmed; employment lag 3-6mo
    - FLOW-POP-04 Local Multiplier Collapse: Retail/restaurant closures concentrated

