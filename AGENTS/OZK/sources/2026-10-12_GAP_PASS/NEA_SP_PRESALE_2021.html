s (subject to an annual limit) to the indenture trustee, the property manager and special servicer, and any relevant third party not previously paid above.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;/table\u0026gt;\n\t\t\n\u0026lt;p\u0026gt;Any remaining funds will be distributed to pay each series of notes pro rata, based on the amounts due in the order of priority shown in table 4. If at a future date the issuer (or any co-issuers) issue additional series, the funds remaining after paying the collateral pool expenses will first be distributed pro rata among all of the outstanding series and then the amount allocated to each series will be distributed in the order of priority shown in table 4.\u0026lt;/p\u0026gt;\u0026lt;h4 class=\u0026quot;tableHeader\u0026quot;\u0026gt;Table 4\u0026lt;/h4\u0026gt;\u0026lt;table border=\u0026quot;0\u0026quot; cellspacing=\u0026quot;0\u0026quot; cellpadding=\u0026quot;0\u0026quot; class=\u0026quot;article \u0026quot;\u0026gt;\n\n\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th class=\u0026quot;tableTitle\u0026quot; colspan=\u0026quot;2\u0026quot;\u0026gt;\nSeries Waterfall\u0026lt;/th\u0026gt;\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th\u0026gt;\nPriority\u0026lt;/th\u0026gt;\n\u0026lt;th\u0026gt;\nPayment\u0026lt;/th\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n1\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nClass A note interest, pro rata.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n2\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nClass B note interest, pro rata.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n3\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nFirst, if any class of notes of a series remains outstanding after the ARD for such class of notes of such series, to the liquidity reserve account, an amount equal to the lesser of (a) the amount necessary to cause the amounts on deposit in the liquidity reserve account to be equal to the liquidity reserve account target for such payment date or (b) 6% of the available amount remaining after application of allocations pursuant to clauses (1) and (2) above; and second, during the occurrence and continuation of a cash reserve target step-up event, to the cash reserve account, an amount, if any, necessary to cause the amounts on deposit in the cash reserve account to be equal to $14,000,000 (or such other amount subject to satisfaction of the rating condition).\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n4\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nIf not during an early amortization period, to each series the scheduled class A scheduled principal payment, pro rata, followed by the unscheduled principal payment amount due to class A, pro rata, and unscheduled proceeds, if any, pro rata. Then to each series the scheduled class B scheduled principal payment, pro rata, followed by the unscheduled principal payment amount due to class B, pro rata, and unscheduled proceeds, if any, pro rata.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n5\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nIf during an early amortization period, to each series, all remaining amounts to the class A notes, followed by the class B notes.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n6\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nIf a wind-down event has occurred, sequentially as follows: first, all remaining available amounts to the class A notes; second, the class A make-whole amounts; third, all remaining available amounts to the class B notes; and fourth, the class B make-whole amounts.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n7\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nIf a wind-down event has not occurred, to each series, sequentially, the class A make-whole amounts, followed by the class B make-whole amounts.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n8\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nTo each series, sequentially, the sum of aggregate class A post-ARD additional interest, followed by the class B post-ARD additional interest.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n9\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nUnpaid issuer expenses and extraordinary expenses, if any.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nIf during a development property cash sweep period, to the development cash sweep reserve account.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n11\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nAll remaining funds to the issuer.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td colspan=\u0026quot;5\u0026quot; class=\u0026quot;tableFootnote\u0026quot;\u0026gt;\nARD--Anticipated repayment date.\u0026lt;/td\u0026gt;\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;/table\u0026gt;\n\t\t\n\u0026lt;p\u0026gt;The structure benefits from a liquidity reserve account, which, if any class of notes remains outstanding after its ARD, is funded through the waterfall (capped each month at 6% of available amounts remaining after allocating to collateral pool expenses and note interest) until it reaches 3.0% of the outstanding principal balance of the notes as of the immediately preceding payment date. Any amounts in the liquidity reserve account remaining after the notes have been paid will be released to the collection account as available amounts. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;The structure also benefits from a cash reserve account, which will be funded with at least $11.0 million of cash at transaction close. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;An early amortization period will take effect if the three-month average DSCR level is less than 1.10x, any series of notes has not been fully redeemed by its respective ARD, or an event of default has occurred. An early amortization period brought on by a low DSCR level will cure after three consecutive months in which the three-month average DSCR level is greater than or equal to 1.10x. As noted in item 5 in table 4, all available funds (after paying expenses and interest) will be paid pro rata to the class A notes, until their principal balances are reduced to zero, then pro rata to class B notes until their principal balances are reduced to zero. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;The property manager must make interest or principal advances on the notes if they are deemed recoverable. The advances are meant to cover any shortfalls resulting from missed lease payments or property vacancies, as well as any interest and principal shortfalls in case the notes will not be paid in full by their final maturity. Principal payments in the post-ARD period (other than on the final maturity date), make-whole amounts, post-ARD additional interest, and deferred post-ARD additional interest are all excluded from this requirement. If the property manager fails to make an advance, the backup manager must make the advance in its place. These requirements for advances are a form of liquidity for the notes.\u0026lt;/p\u0026gt;\u0026lt;a name=\u0026quot;ID2489\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Letters of credit and development property account \u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;The structure benefits from letters of credit.\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;The development property account will be funded with 100% of the remaining budgeted construction costs (estimated to be approximately $1.096 billion at closing), an amount sufficient to fund the remaining budgeted construction costs of the development properties. The funds will be advanced to the construction agent, Amazon, as set forth in the construction agency agreements. The property manager expects to have advanced all funds in the development property account to Amazon by the end of September 2023.\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;To the extent that a property has not reached substantial completion nine months after the rent commencement date of the related development property, all remaining cash flows available to equity will be diverted to the development property cash sweep reserve account. Funds swept into this account, if any, will be released to the issuer upon construction completion or to the waterfall upon early amortization. \u0026lt;/p\u0026gt;\n\n\u0026lt;a name=\u0026quot;ID2500\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;S\u0026amp;amp;P Global Ratings' Stress Scenario Assumptions\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;We believe the risk to the cash flow generated from this portfolio of properties and their associated leases stems from five major factors:\u0026lt;/p\u0026gt;\u0026lt;ul\u0026gt;\u0026lt;li\u0026gt;A default by the sole initial tenant and guarantor;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The property manager's ability to re-lease the properties if they are vacated by non-renewing or defaulted tenants;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The credit quality of new tenants and their lease terms (rental rate and term of lease);\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The liquidation value of properties that the manager is unable to re-lease and chooses to liquidate; and\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;Optional termination provisions if the landlord determines property damage that will take over 60 days to repair in the last year of Amazon's lease. \u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;a name=\u0026quot;ID2517\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Initial leases to Amazon's subsidiaries\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;For rating stress scenarios at and below Amazon's current ICR, we assume no haircuts to the scheduled lease cash flows for the initial leases to Amazon's subsidiaries. For example, given an economic environment commensurate with 'AA-' stress, our assumption, given Amazon's current 'AA' ICR, is that Amazon will not default on its lease obligations. It is important to note that this assumption means that our ratings on the notes will be constrained by Amazon's ICR. If Amazon's ICR is lowered, our ratings on the class A notes will most likely be lowered as well. It is also important to note that because our projected cash flows over the life of the transaction consist of rent cash flows paid by Amazon, rent paid by subsequent tenants, and property liquidation proceeds, it is possible that our senior note ratings could migrate further beneath Amazon's ICR if our expectations for property liquidation value or replacement tenant lease cash flows change.\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Following Amazon's initial lease terms, we have assumed Amazon will not be renewing any leases. While we recognize that the logistics properties are an essential part of Amazon's logistics network and that Amazon has multiple five-year extension options on each lease, we believe that the initial lease terms of 10.3, 12.5, 15.0, and 20 years are quite long and create substantial uncertainty as to Amazon's needs for the properties at the end of that long horizon.\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID2525\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;40-year legal final maturity\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;Though the notes have legal final maturities of 40 years, for the purpose of our stress scenarios, we have assumed only 20 years of lease cash flows in our 'AA-' scenario and 30 years in our 'A-' scenario, each followed by the liquidation of any remaining properties at the S\u0026amp;amp;P Global Ratings value. Although the transaction documents do not mandate such a liquidation at those times, we believe that such liquidations by the property manager would be consistent with the servicing standard. For example, it is possible in a severely stressed environment that the property manager may observe significant deterioration in certain property markets and consider property sales to be the most appropriate way to maximize value for noteholders.\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID2531\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Cash flow analysis\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;To determine whether the available credit support is sufficient to withstand assumed losses, we examined various simulated cash flow scenarios. In each scenario, we assumed the application of the default rates described below, for the replacement tenant leases, across four default curves in one default cycle (see table 5). Although the transaction documents require the property manager and backup manager to make advances on interest payments (if deemed recoverable), no advances were assumed in the cash flow modeling scenarios. Additionally, we have assumed no receipt of insurance proceeds, such as business interruption insurance payments, given insured casualty or condemnation events. In each rating stress scenario, the respective notes were paid timely interest and full principal by their rated final maturity.\u0026lt;/p\u0026gt;\u0026lt;h4 class=\u0026quot;tableHeader\u0026quot;\u0026gt;Table 5\u0026lt;/h4\u0026gt;\u0026lt;table border=\u0026quot;0\u0026quot; cellspacing=\u0026quot;0\u0026quot; cellpadding=\u0026quot;0\u0026quot; class=\u0026quot;article \u0026quot;\u0026gt;\n\n\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th class=\u0026quot;tableTitle\u0026quot; colspan=\u0026quot;5\u0026quot;\u0026gt;\nDefault Curves (%)\u0026lt;/th\u0026gt;\n\n\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th\u0026gt;\nYear\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nCurve 1\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nCurve 2\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nCurve 3\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nCurve 4\u0026lt;/th\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n1\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n40\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n15\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n2\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n15\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n3\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n15\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n4\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n40\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n15\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n5\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n15 \u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n6\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n15\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n7\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n40\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n10\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;/table\u0026gt;\n\t\t\n\n\u0026lt;a name=\u0026quot;ID2750\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Replacement tenant, renewal, and liquidation stress assumptions\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;We utilized the Standard \u0026amp;amp; Poor's CDO Evaluator to estimate default rates for potential replacement tenants. We assumed that replacement tenants would have average ratings of 'B (sf)', that each property would be occupied by a unique tenant, and that replacement lease terms would be 10 years for the fulfillment centers and seven years for the last-mile delivery centers and the outbound cross dock. Under our 'AA-' and 'A-' stress scenarios, our default assumptions for the portfolio are 84.62% and 76.92%, respectively.\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Additional modeling assumptions are shown in Table 6 below. For the properties on which a replacement tenant defaulted, we assumed that 36.7% and 26.7% -- based on the 'AA-' and 'A-' stress scenarios, respectively -- would be sold at a stressed liquidation value of 17.8% and 21.0% of the appraised value, respectively (subject to a 24-month lag for the 'AA-' scenario and 12-month lag for the 'A-' scenarios).\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;We assumed the remaining defaulted properties were re-leased for a second lease cycle (subject to a 24-month lag under the 'AA-' stress scenario and a 12-month lag under the 'A-' stress scenarios) at a rental rate equal to 66.7% and 71.7% of the prior rental rate under 'AA-' and 'A-' stress scenarios, respectively. At the end of this second lease cycle, we assumed those leases would be liquidated at 47.2% of the appraisal value (subject to a 12-month lag for the 'AA-' scenario and six-month lag for the 'A-' scenarios). \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Finally, for performing properties, we assumed a re-leased rental rate of 81.7% and 86.7% for the 'AA-' and 'A-' stress scenarios. During projected recessionary periods, we assumed no scheduled rental increases. Thereafter, we assumed a 47.2% liquidation value of those properties following a 12-month lag in the 'AA-' scenario and six-month lag in the 'A-' scenario. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;To determine the various liquidation values assumed above, we estimated the properties' value using our commercial real estate methodology under two specific circumstances:\u0026lt;/p\u0026gt;\u0026lt;ul\u0026gt;\u0026lt;li\u0026gt;The property is occupied by a tenant that is making full payments under the lease (the leased value). In determining each property's leased value, we assumed rental income based on the in-place leases, the appraiser's estimate of market rent, and recent leasing data from the market. We also applied a vacancy deduction to the potential gross income. We estimated expenses and expense reimbursements based on information from the appraisals and comparable properties. These expenses included fixed items such as real estate tax and insurance, estimated management fees, and variable expenses that were reimbursed in our income projections. We determined the net cash flow after deducting estimated leasing commissions, tenant improvement expenses, and capital reserves/expenditures based on projected lease roll assumptions. We selected direct capitalization rates based on factors such as appraisal and market cap rates, property performance and tenant strength, and property type.\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The property is unoccupied, but it is in a viable location that can be used with minor structural improvements (the dark value). In determining a dark value, we assumed each property was unoccupied and unencumbered by any leases. Because we viewed this operating performance decline as temporary, we stabilized the dark properties with income and expense projections, based on market data and information from the appraisal. We deducted capital items from our net operating income, including tenant improvements and leasing costs required to lease up the entire unoccupied space. We then estimated one year of downtime for the lease up. We used a stressed capitalization rate for this analysis.\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;h4 class=\u0026quot;tableHeader\u0026quot;\u0026gt;Table 6\u0026lt;/h4\u0026gt;\u0026lt;table border=\u0026quot;0\u0026quot; cellspacing=\u0026quot;0\u0026quot; cellpadding=\u0026quot;0\u0026quot; class=\u0026quot;article \u0026quot;\u0026gt;\n\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th class=\u0026quot;tableTitle\u0026quot; colspan=\u0026quot;3\u0026quot;\u0026gt;\nStress Assumptions\u0026lt;/th\u0026gt;\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th\u0026gt;\nStress level\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n'AA-'\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n'A-'\u0026lt;/th\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nRoof replacement expense assumption (at earlier of year 19 or roof membrane warranty expiration period) \n($/modifed NNN lease sq. ft., subject to 3.0% annual inflation)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n7.5\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n7.5\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;tableSubHead\u0026quot; colspan=\u0026quot;3\u0026quot;\u0026gt;\nPost-Amazon lease assumptions\u0026lt;/td\u0026gt;\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nRe-lease lag (mos. from effective end of Amazon's initial lease term to start of new lease)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n12\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n6\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nPortfolio scenario default rate (%)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n84.62\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n76.92\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nPost-year 20 cash flow haircut (%)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n100.00\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n0.00\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;tableSubHead\u0026quot; colspan=\u0026quot;3\u0026quot;\u0026gt;\nNon-defaulting leases\u0026lt;/td\u0026gt;\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nLease rate credit upon renewal  (% of wtd. avg. ending contractual payment rate)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n81.67\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n86.67\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nLiquidation lag time  (mos. following end of second lease term)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n12\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n6\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nLiquidation proceeds (% of appraised value)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n47.23\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n47.23\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;tableSubHead\u0026quot; colspan=\u0026quot;3\u0026quot;\u0026gt;\nDefaulted leases\u0026lt;/td\u0026gt;\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nAccepted in bankruptcy (%)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n13.33\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n23.33\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;tableSubHead\u0026quot; colspan=\u0026quot;3\u0026quot;\u0026gt;\nDefaulted leases rejected in bankruptcy\u0026lt;/td\u0026gt;\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nRejected defaults re-leased (%)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n63.33\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n73.33\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nRejected defaults liquidated (%)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n36.67\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n26.67\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nRejected leases - liquidated\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt; \u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt; \u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nLiquidation lag time (mos.)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n24\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n12\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nLiquidation proceeds (% of initial appraised value)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n17.83\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n21.04\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;tableSubHead\u0026quot; colspan=\u0026quot;3\u0026quot;\u0026gt;\nRejected leases - re-leased\u0026lt;/td\u0026gt;\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nRe-lease lag (mos.)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n24\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n12\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;indentedText1\u0026quot;\u0026gt;\nRe-lease lease rate credit (%)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n66.67\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n71.67\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td colspan=\u0026quot;7\u0026quot; class=\u0026quot;tableFootnote\u0026quot;\u0026gt;\nNNN--Triple-net.\n\u0026lt;/td\u0026gt;\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;/table\u0026gt;\n\t\t\n\n\n\u0026lt;a name=\u0026quot;ID3072\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Cash Flow Scenarios\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;As mentioned above, the structure benefits from date certain leases on the 11 development properties, as well as Amazon's obligation to repurchase the properties at each property's construction purchase price if they fail to be completed by their respective outside development property completion dates (typically 12 months after the expected construction completion date). Additional structural support is provided by the existing development property account -- sized to cover 100% of the remaining construction costs for the development properties (estimated to be $1.096 billion as of transaction close) -- as well as the letters of credit provided by Goldman Sachs Bank USA and Barclays Bank PLC, which will have a maximum commitment amount of $1.951 billion at transaction close and equal to 104% of the budgeted construction cost of the respective development properties. The letters of credit effectively serve as a back-stop of Amazon's obligation to purchase the development properties should they not be completed by their respective outside development property completion dates.\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Our cash flow analysis did not rely on Amazon's obligation to repurchase the properties at the construction purchase price should they fail to be completed. Instead, we assumed that funds necessary to repurchase the uncompleted properties would be drawn from the committed letters of credit, and/or funds remaining in the development property account. Specifically, we considered the three scenarios below. \u0026lt;/p\u0026gt;\u0026lt;a name=\u0026quot;ID3079\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Scenario 1\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;Immediately after deal closing, it becomes evident that construction on all eight development properties (that are not substantially completed properties) will not be completed by each property's respective outside development property completion date. In this case, funds remaining in the development property account would be available to partially paydown the notes. Additional funds would be available from the letters of credit back-stopping Amazon's commitment to repurchase the development properties. Although the leases on the development properties are technically guaranteed by Amazon, our analysis also assumes that rent cash flow is collected only from the five properties that are completed or substantially completed as of the closing date. Liquidation proceeds are received only from these properties as well. \u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID3085\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Scenario 2\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;Properties are essentially complete using all funds in the development property account, however, temporary certificates of occupancy (TCO) are not issued. Because the issuance of the TCO effectively marks a property's transition from a development property to a substantially completed property and allows Amazon to operate in a respective building, Amazon fails to take hold of the property. In this scenario, funds in the development property account are exhausted, and the repurchase of properties at the construction purchase price relies solely on the available letters of credit. Similar to scenario 1, scenario 2 assumes rent and liquidation cash flow is collected only from the five properties that are completed or substantially completed as of the closing date. \u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID3091\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Scenario 3\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;Construction is completed on all eight development properties (that are not substantially completed properties). Funds from the development property account are used to complete the construction, and the letters of credit remain undrawn. Paydown of the notes relies solely on the rent and liquidation cash flows of the 13 properties. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;In each of the scenarios above, the respective notes were paid timely interest and full principal by their rated final maturity.\u0026lt;/p\u0026gt;\u0026lt;div class=\u0026quot;chart\u0026quot;\u0026gt;\u0026lt;h4 class=\u0026quot;chartHeader\u0026quot;\u0026gt;Chart 1\u0026lt;/h4\u0026gt;\n\u0026lt;img border=\u0026quot;0\u0026quot; alt=\u0026quot;image\u0026quot; src=\u0026quot;/images/2743098_13460071.svg\u0026quot; class=\u0026quot;\u0026quot;\u0026gt;\n\n\u0026lt;/div\u0026gt;\n\n\u0026lt;a name=\u0026quot;ID3148\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Supplemental sensitivity tests\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Sensitivity 1\u0026amp;nbsp;\u0026lt;/span\u0026gt; \u0026lt;/p\u0026gt;\n\u0026lt;p\u0026gt;Given Amazon's ability to optionally terminate the leases in the final year of their initial term in an event of casualty damage to a related property during the last year of a lease term requiring more than 60 days to repair, we performed supplemental sensitivity tests assuming that Amazon terminates each lease 12 months prior to the initial maturity. Following each option termination, we assumed a 12-month release lag in our 'AA-' scenario and a six-month lag in our 'A-' scenario. Though we believe the likelihood of such events occurring for every property in the final year of the initial lease term is remote, we nevertheless wanted to assess the transaction's ability to withstand such a liquidity stress. We determined that the notes were paid timely interest and ultimate principal in these scenarios. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Sensitivity 2\u0026amp;nbsp;\u0026lt;/span\u0026gt; \u0026lt;/p\u0026gt;\n\u0026lt;p\u0026gt;In each of the three scenarios tested above, we assumed that USAARE would be responsible for roof membrane replacement at the later of year 19 or immediately after the expiration of in-place roof membrane warranties. As shown in table 6, our expense assumption is $7.50 per square foot of modified-NNN footprint square footage, subject to annual inflation of 3.0% per annum. To account for the possibility that the proportion of modified-NNN properties within the pool could increase due to property or tenant replacement (within a specified concentration limit of 15% of the portfolio by appraised value), we stressed the roof membrane expense stress by an additional 50%. We determined that the notes were paid timely interest and ultimate principal in this scenario.\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID3166\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Qualitative adjustment to the cash flow-implied rating for class B notes\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;Though the class B notes passed our cash flow stresses at the 'A+' level, paying timely interest and ultimate principal, we lowered the rating two notches, on a qualitative basis, to arrive at a final rating of 'A- (sf)'. This adjustment was due to our comparative analysis of the class B notes relative to other NNN notes S\u0026amp;amp;P Global Ratings has rated in the single-A rating category. Despite the unique strength of the initial lease agreements, the initial tenant credit quality, and the high quality of the new-build properties and their locations, we felt the leverage of this transaction's class B notes, relative to those other notes, was a significant outlier at a 90% LTV ratio, compared to the average of 70% for the single-A category. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Additionally, we observed that in our stress scenarios the class B notes de-lever more slowly, with most of its principal paid down by our assumed property liquidation proceeds at year 20 in our 'AA-' scenario. We note that we did not make a similar adjustment for the class A notes. Although the class A notes' initial leverage at a 75% LTV ratio is also high compared to that of other similar NNN notes, we believe the notes' ratings should be more closely aligned with the ICR of Amazon, given that the majority of the notes' projected principal paydown comes from Amazon's contractual lease payments. The same is not the case of the class B notes, which are paid down primarily from property liquidation proceeds in our analysis. See chart 2 below for aggregate LTV migration over time under out 'AA-' stress scenario.\u0026lt;/p\u0026gt;\u0026lt;div class=\u0026quot;chart\u0026quot;\u0026gt;\u0026lt;h4 class=\u0026quot;chartHeader\u0026quot;\u0026gt;Chart 2\u0026lt;/h4\u0026gt;\n\u0026lt;img border=\u0026quot;0\u0026quot; alt=\u0026quot;image\u0026quot; src=\u0026quot;/images/2743098_13460075.svg\u0026quot; class=\u0026quot;\u0026quot;\u0026gt;\u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n\n\t\t\n\u0026lt;/div\u0026gt;\n\n\n\u0026lt;a name=\u0026quot;ID6161\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Legal Structure\u0026lt;/h4\u0026gt;\n\u0026lt;div class=\u0026quot;chart\u0026quot;\u0026gt;\u0026lt;h4 class=\u0026quot;chartHeader\u0026quot;\u0026gt;Chart 3\u0026lt;/h4\u0026gt;\n\u0026lt;img border=\u0026quot;0\u0026quot; alt=\u0026quot;image\u0026quot; src=\u0026quot;/images/2743098_13460073.svg\u0026quot; class=\u0026quot;\u0026quot;\u0026gt;\n\n\u0026lt;/div\u0026gt;\n\u0026lt;p\u0026gt;The issuer, New Economy Assets \u0026ndash; Phase 1 Issuer LLC, and the closing date asset entities (asset entities), USRE Pine LLC, USRE Diana LLC, USRE Willa LLC, USRE Star LLC, USRE Stampede LLC, USRE Merrillville LLC, USRE Indianapolis LLC, USRE Savannah LLC, USRE Rochester LLC, USRE St. Louis LLC, USRE Manitou LLC, USRE Hawthorne LLC, and USRE ROC39 LLC are bankruptcy-remote Delaware limited partnerships. The issuer and the asset entities, collectively the obligors, were formed for the sole purpose of holding the mortgaged properties (in the case of the asset entities) or issuing notes and owning the asset entities (in the case of the issuer).\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;The issuer will grant a security interest in all of the equity interest in each asset entity to the indenture trustee on behalf of the noteholders as collateral security for the notes. Each asset entity will guarantee the notes and grant a security interest to the indenture trustee for the benefit of the noteholders in all of its personal property and fixtures and will mortgage its interests in its properties as collateral security for such guarantee.\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;The obligors' SPE provisions are expected to be consistent with S\u0026amp;amp;P Global Ratings' bankruptcy-remoteness criteria. In rating this transaction, S\u0026amp;amp;P Global Ratings will review the legal matters it believes are relevant to its analysis, as outlined in its criteria. \u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID6220\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Surveillance\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;We will maintain active surveillance on the rated notes until the notes mature or are retired. Our surveillance will also monitor the issuer credit rating of Amazon.com Inc. The purpose of surveillance is to assess whether the notes are performing within the initial parameters and assumptions applied to each rating category. The transaction terms require the issuer to supply periodic reports and notices to S\u0026amp;amp;P Global Ratings for maintaining continuous surveillance on the rated notes.\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID6226\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Related Criteria\u0026lt;/h4\u0026gt;\n\u0026lt;ul\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/12085396\u0026quot;\u0026gt;General Criteria: Environmental, Social, And Governance Principles In Credit Ratings\u0026lt;/a\u0026gt;, Oct. 10, 2021\n\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/11734324\u0026quot;\u0026gt;Criteria | Structured Finance | General: Global Framework For Payment Structure And Cash Flow Analysis Of Structured Finance Securities\u0026lt;/a\u0026gt;, Dec. 22, 2020\n\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/10950501\u0026quot;\u0026gt;Criteria | Structured Finance | Legal: U.S. Structured Finance Asset Isolation And Special-Purpose Entity Criteria\u0026lt;/a\u0026gt;, May 15, 2019\n\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/10861340\u0026quot;\u0026gt;Criteria | Structured Finance | General: Counterparty Risk Framework: Methodology And Assumptions\u0026lt;/a\u0026gt;, March 8, 2019\n\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/9779138\u0026quot;\u0026gt;General Criteria: Guarantee Criteria\u0026lt;/a\u0026gt;, Oct. 21, 2016\n\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/9576496\u0026quot;\u0026gt;Criteria | Structured Finance | ABS: Methodology And Assumptions For Rating North American Single-Tenant Real Estate Triple-Net Lease-Backed Securitizations\u0026lt;/a\u0026gt;, March 31, 2016\n\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/9006646\u0026quot;\u0026gt;General Criteria: Methodology And Assumptions For Analyzing Letter Of Credit-Supported Debt\u0026lt;/a\u0026gt;, Feb. 20, 2015\n\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/8737366\u0026quot;\u0026gt;Criteria | Structured Finance | General: Global Framework For Assessing Operational
