alse,"id":"id17"},{"name":"Related Criteria","isCurrent":false,"id":"id18"},{"name":"Related Research","isCurrent":false,"id":"id19"}],"html":"\n\n\t\n\n\t\t\n\n\t\t\n\t\t\u0026lt;div id=\u0026quot;researchContent\u0026quot;\u0026gt;\u0026lt;div id=\u0026quot;articleLinkBox\u0026quot;\u0026gt;\u0026lt;a href=\u0026quot;#ContactInfo\u0026quot; class=\u0026quot;contactInfo\u0026quot;\u0026gt;View Analyst Contact Information\u0026lt;/a\u0026gt;\u0026lt;ul id=\u0026quot;navResearchArticle\u0026quot; class=\u0026quot;nav\u0026quot; onmouseover=\u0026quot;javascript:researchTOCOver();\u0026quot; onmouseout=\u0026quot;javascript:researchTOCOff();\u0026quot;\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;javascript:void(0);\u0026quot;\u0026gt;Table of Contents\u0026lt;/a\u0026gt;\u0026lt;ul id=\u0026quot;navResearchArticleUL\u0026quot;\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID401\u0026quot;\u0026gt;Advance Notice Of Proposed Criteria Change Published For North American Single-Tenant Real Estate Triple-Net Lease-Backed Securities\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID414\u0026quot;\u0026gt;Rationale\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID489\u0026quot;\u0026gt;Environmental, Social, And Governance (ESG) Factors\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID495\u0026quot;\u0026gt;Transaction Strengths And Weaknesses\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID597\u0026quot;\u0026gt;Business Description: New Economy Assets \u0026ndash; Phase 1 Issuer LLC \u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID605\u0026quot;\u0026gt;Underwriting, Collection, And Property Management Process\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID611\u0026quot;\u0026gt;Macroeconomic Outlook\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID617\u0026quot;\u0026gt;Industry Characteristics: Sector Outlook\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID623\u0026quot;\u0026gt;Logistics Real Estate\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID633\u0026quot;\u0026gt;Amazon\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID652\u0026quot;\u0026gt;Pool And Structural Characteristics\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID2178\u0026quot;\u0026gt;Transaction Structure\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID2500\u0026quot;\u0026gt;S\u0026amp;amp;P Global Ratings' Stress Scenario Assumptions\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID3072\u0026quot;\u0026gt;Cash Flow Scenarios\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID6161\u0026quot;\u0026gt;Legal Structure\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID6220\u0026quot;\u0026gt;Surveillance\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID6226\u0026quot;\u0026gt;Related Criteria\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID6320\u0026quot;\u0026gt;Related Research\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;div class=\u0026quot;clear\u0026quot;\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;editorNote\u0026quot;\u0026gt;\u0026lt;p\u0026gt;(\u0026lt;strong\u0026gt;Editor's Note: \u0026lt;/strong\u0026gt;This presale report was originally published on Oct. 18, 2021. Since then, the Environmental, Social, And Governance (ESG) Factors section has been updated to provide more detail on the ESG factors we consider for the triple-net lease securitization sector.)\u0026lt;/p\u0026gt;\u0026lt;/div\u0026gt;\n\u0026lt;h4 class=\u0026quot;tableHeader\u0026quot;\u0026gt;\u0026lt;/h4\u0026gt;\u0026lt;table border=\u0026quot;0\u0026quot; cellspacing=\u0026quot;0\u0026quot; cellpadding=\u0026quot;0\u0026quot; class=\u0026quot;article \u0026quot;\u0026gt;\n\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th class=\u0026quot;tableTitle\u0026quot; colspan=\u0026quot;6\u0026quot;\u0026gt;\nPreliminary Ratings \u0026lt;/th\u0026gt;\n\n\n\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th\u0026gt;\nIssue\u0026lt;/th\u0026gt;\n\u0026lt;th\u0026gt;\nPreliminary rating(i)\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nPreliminary amount ($ mil.)\u0026lt;/th\u0026gt;\n\u0026lt;th\u0026gt;\nARD\u0026lt;/th\u0026gt;\n\u0026lt;th\u0026gt;\nLegal final maturity date\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nLTV ratio (%)(ii)\u0026lt;/th\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nA-1\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nAA- (sf)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n2,242.80\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n10/20/2026\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n10/20/2061\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n75.0\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nB-1\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nA- (sf)\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n448.56\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n10/20/2026\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\n10/20/2061\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\n90.0\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td colspan=\u0026quot;13\u0026quot; class=\u0026quot;tableFootnote\u0026quot;\u0026gt;\nNote: This presale report is based on information as of Oct. 18, 2021. The ratings shown are preliminary. This report does not constitute a recommendation to buy, hold, or sell securities. Subsequent information may result in the assignment of final ratings that differ from the preliminary ratings. (i)The ratings do not address post-ARD additional interest. (ii)LTV ratios are calculated using the commercial properties' aggregate appraised value. ARD--Anticipated repayment date. LTV--Loan-to-value. \u0026lt;/td\u0026gt;\n\n\n\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;/table\u0026gt;\n\t\t\n\u0026lt;h4 class=\u0026quot;tableHeader\u0026quot;\u0026gt;\u0026lt;/h4\u0026gt;\u0026lt;table border=\u0026quot;0\u0026quot; cellspacing=\u0026quot;0\u0026quot; cellpadding=\u0026quot;0\u0026quot; class=\u0026quot;article \u0026quot;\u0026gt;\n\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th class=\u0026quot;tableTitle\u0026quot; colspan=\u0026quot;2\u0026quot;\u0026gt;\nProfile\u0026lt;/th\u0026gt;\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nExpected closing \u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nOct. 27, 2021.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nCollateral\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nThirteen industrial distribution and fulfillment centers in the U.S. leased to a subsidiary of Amazon.com Inc. pursuant to triple-net and modified triple-net lease agreements guaranteed by Amazon.com Inc., including 11 development properties with respect to which the related tenant has agreed to complete construction and/or improvements pursuant to a related construction agency agreement. Three of those development properties are substantially complete, meaning the tenant has substantially completed construction and/or improvements and has obtained a temporary or final certificate of occupancy.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nSponsor, property manager, and special servicer\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nNew Economy Assets \u0026ndash; Phase 1 Sponsor LLC, an indirect wholly owned subsidiary of funds and accounts managed by US RE Co. LLC (d/b/a USAA Real Estate Co. LLC).\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nIssuer\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nNew Economy Assets \u0026ndash; Phase 1 Issuer LLC.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nBackup manager\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nKeyBank N.A.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nIndenture trustee and custodian\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nWells Fargo Bank N.A.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nLetter of credit providers\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nGoldman Sachs Bank USA and Barclays Bank plc.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nJoint bookrunners\u0026lt;/td\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\nGoldman Sachs \u0026amp;amp; Co. LLC and Barclays.\u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td colspan=\u0026quot;5\u0026quot; class=\u0026quot;tableFootnote\u0026quot;\u0026gt;\nD/b/a\u0026mdash;Doing business as.\u0026lt;/td\u0026gt;\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;/table\u0026gt;\n\t\t\n\u0026lt;a name=\u0026quot;ID401\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Advance Notice Of Proposed Criteria Change Published For North American Single-Tenant Real Estate Triple-Net Lease-Backed Securities\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;S\u0026amp;amp;P Global Ratings announced on Sept. 7, 2021, that it is in the process of reviewing its criteria for rating single-tenant real estate triple-net lease-backed transactions issued in North America. The ratings assigned by S\u0026amp;amp;P Global Ratings to the notes could change as a result of that review. The nature of any potential rating changes will depend on the final criteria adopted, as well as our assessment of the transaction. We cannot provide an estimated completion date for our criteria review at this time. Please see \u0026quot;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/12097047\u0026quot;\u0026gt;Advance Notice Of Proposed Criteria Change: North American Single-Tenant Real Estate Triple-Net Lease-Backed Securities\u0026lt;/a\u0026gt;,\u0026quot; published Sept. 7, 2021, for more information.\n\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID414\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rationale\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;The preliminary ratings assigned to New Economy Assets \u0026ndash; Phase 1 Issuer LLC's $2.69136 billion net lease mortgage notes series 2021-1 reflect our view of: \n\u0026lt;/p\u0026gt;\u0026lt;ul\u0026gt;\u0026lt;li\u0026gt;The strength of the initial triple-net (NNN) and modified NNN lease agreements, which are unconditionally guaranteed by Amazon.com Inc. (Amazon; AA/Stable/A-1+) and prohibit optional termination, except in the event of condemnation or casualty damage to a related property during the last year of a lease term requiring more than 60 days to repair; \n\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The mitigation of construction risk through development property letters of credit, with maximum commitments of $1.951 billion at transaction close and equal to 104% of the maximum budgeted construction cost of the respective development properties and provided independently by Goldman Sachs Bank USA and Barclays Bank plc for each development property that is not substantially complete as of the closing date; the letters of credit must be drawn for any development property not completed within 14 months and 10 business days following the scheduled rent commencement date and all draw proceeds will be applied as unscheduled principal payment amounts; \u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The properties' value, as reflected by the S\u0026amp;amp;P Global Ratings' property analysis;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The construction agency agreements in place with Amazon for the 11 properties that aren't yet completed (i.e., development properties), whereby Amazon is fully responsible for construction completion and funding of any construction expenses in excess of the 100% of budgeted cost provided for by the transaction's development property account and development property overage account;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The date-certain language in the leases that requires the tenants to begin paying rent no later than the specified lease start date, even in the case that construction is not yet completed;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The cash flows that can be generated by the properties from potential replacement tenants, should the initial tenants not renew their leases at the end of the initial lease terms;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The credit enhancement available in the form of subordination for the class A-1 notes;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The transaction's overcollateralization (the aggregate appraised value minus the aggregate series principal balance); \u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;Three forms of liquidity support: the cash reserve account (for the period of time before rent has commenced on all developed properties, or by which time the 3-month average debt service coverage ratio, excluding available amounts in the cash reserve account, has reached 1.50x), expected to be funded with an initial amount of at least $11.0 million; the liquidity reserve account (if any class of notes remains outstanding after its anticipated repayment date [ARD]); and the property manager's and backup manager's obligation to make principal and interest advances to the notes;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The projected cash flows supporting the notes; and\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The transaction's legal and payment structures.\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;p\u0026gt;New Economy Assets \u0026ndash; Phase 1 Issuer LLC's series 2021-1 is the first issuance out of this master trust. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;We rated the notes under our \u0026quot;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/6485398\u0026quot;\u0026gt;Principles of Credit Ratings\u0026lt;/a\u0026gt;,\u0026quot; published Feb. 16, 2011, with certain stress assumptions borrowed from our triple-net ABS criteria \u0026quot;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/9576496\u0026quot;\u0026gt;Methodology And Assumptions For Rating North American Single-Tenant Real Estate Triple-Net Lease-Backed Securitizations\u0026lt;/a\u0026gt;,\u0026quot; published March 31, 2016, and from our letter of credit criteria \u0026quot;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/9006646\u0026quot;\u0026gt;Methodology And Assumptions For Analyzing Letter Of Credit-Supported Debt\u0026lt;/a\u0026gt;,\u0026quot; published Feb. 20, 2015.\n\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Although the initial leases are guaranteed by Amazon, the notes' timely interest and ultimate principal payments are not guaranteed. Our rating analysis, detailed in the Stress Scenario Assumptions section below, considers a variety of scenarios, including those where properties are re-leased to tenants other than Amazon, following Amazon's initial lease terms. Nevertheless, in all scenarios, the majority of projected cash flows come from Amazon. For this reason, we consider the ratings on the senior notes capped by Amazon's issuer credit rating (ICR), but not weak-linked to that ICR. If Amazon's ICR is lowered or any of the payment obligations under the guaranty are not satisfied, our ratings on the class A notes may be lowered as well. Because our projected cash flows over the life of the transaction consist of proceeds from the development property account and/or the letters of credit, the rent cash flows paid by Amazon, rent paid by subsequent tenants, and property liquidation proceeds, it is possible that our senior note ratings could migrate further beneath Amazon's ICR if our expectations for property liquidation value or replacement tenant lease cash flows change (see the S\u0026amp;amp;P Global Ratings' Stress Scenario Assumptions section below).\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID489\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Environmental, Social, And Governance (ESG) Factors\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;Our rating analysis considered the potential exposure of the transaction to ESG credit factors. Triple-net lease securitizations have potential exposure to environmental credit factors. Environmental risks can have serious and material effects on the value of real estate and, consequently, the credit quality of rated transactions. To evaluate environmental risks on real estate properties, we have reviewed the environmental and property condition assessment reports that the sponsor obtained. We also reviewed covenants that generally require tenants to maintain properties in good condition and to appropriately address any exposure to environmental conditions. To mitigate risks from extreme weather events (such as flood or earthquake), fire and casualty events, or incidents of terrorism, tenants generally have insurance policies to mitigate the risk of natural disasters and damage-causing events or have indemnified the lessor against such risks. In addition, geographic diversity of the collateral pool may partially mitigate these environmental risks. Our ratings on the notes were not negatively affected by our consideration of these factors.\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID495\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Transaction Strengths And Weaknesses\u0026lt;/h4\u0026gt;\n\u0026lt;a name=\u0026quot;ID498\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Strengths\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;The transaction's strengths, in our opinion, include the following:\u0026lt;/p\u0026gt;\u0026lt;ul\u0026gt;\u0026lt;li\u0026gt;The strength of the NNN leases, which are long term (19.23-year weighted average remaining lease term with weighted average 1.52% annual escalators), unconditionally guaranteed by Amazon, and without any optional termination provisions (other than condemnation or events of casualty damage to a related property during the last year of a lease term requiring more than 60 days to repair);\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The quality of the properties, which are operationally essential to Amazon's logistics network and are all -- with the exception of one property -- new builds or complete renovations located in critical locations for logistics service providers;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The date-certain structure of the leases for the development properties, which requires the tenants to begin paying at the specified lease start dates regardless of the state of construction completion;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;Amazon's guarantee of construction completion for 11 of the development properties or substantially completed properties, for which, as of the statistical disclosure date of Aug. 31, 2021, 14.0%-75.0% of the construction budget has been funded pursuant to each construction agency agreement and which are expected by the sponsor to be substantially completed by June 2023;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The presence of the development property account to cover up to 100% of the budgeted construction costs and the requirement that Amazon fund any excess costs beyond that;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The presence of the cash reserve account, expected to be funded with at least $11.0 million to cover any shortfalls between closing and the start of monthly lease payments on the development properties;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The NNN nature of 89.73% of the portfolio, requiring the tenants to pay all maintenance, taxes, and insurance on the properties;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The geographic diversity of the 13 properties, which are located across eight states;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The securitization structure, including the property manager's and backup manager's obligation to make principal and interest and property protection advances to the extent deemed recoverable;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The properties' satisfactory environmental findings based on Environmental Phase 1, and, if necessary, Phase 2 results; \u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The performance-based triggers, including the rapid amortization trigger, triggered if any class of notes is still outstanding after its ARD or if the 1.10x three-month average debt service coverage ratio (DSCR) trigger is breached; and\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The liquidity reserve account, which, if any notes remain outstanding past their ARD, will be funded through the waterfall (capped each month at 6.0% of available amounts remaining after allocating to collateral pool expenses and note interest) until it reaches 3.0% of the outstanding principal balance of the notes.\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\n\u0026lt;a name=\u0026quot;ID530\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Weaknesses\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;The transaction's weaknesses, in our opinion, include the following:\u0026lt;/p\u0026gt;\u0026lt;ul\u0026gt;\u0026lt;li\u0026gt;The high obligor and property concentration, with only one initial obligor (Amazon) and 13 properties;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The under-construction status of certain properties, which account for approximately 73.29% of the collateral pool's appraised value;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The tenant's ability to optionally terminate the leases in the event of condemnation or due to events of casualty damage to a related property during the last year of a lease term requiring more than 60 days to repair;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The tenant's ability to relocate at the end of the initial lease term, which may decrease the occupancy rate and lease income, and the uncertain time needed for the property manager to find a replacement tenant, especially if such lease maturities coincide with periods of weak property demand or oversupply;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The large size of the warehouses backing the deal, with footprints ranging from approximately 141,360 sq. ft. to 823,871 sq. ft., which may challenge the property manager's ability to find a single replacement tenant to take over each lease (although subdivision of the warehouses is possible);\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The uncertain credit quality of potential replacement tenants that could lease the properties if Amazon elects not to renew, and the uncertain lease terms that could be extended to them;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The development properties' non-cash-flowing period between the closing date and their rent commencement dates ranging between Jan. 10, 2022, and June 28, 2023, potentially resulting in negative carry on the notes; however, capitalized cash flows on the cumulative construction costs mitigate this risk;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The relatively high loan-to-value (LTV) ratio at closing compared to other similar NNN transactions;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The notes' 40-year legal final maturity date, which may expose them to elevated tail risk if they remain outstanding until that date;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The properties' exposure to laws and regulations relating to human health and the environment;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;Maintenance capital expenditures that the landlord may be required to incur for the modified NNN lease properties; and\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;A potential construction period event of default, which could prevent the transaction from receiving substantial amounts of future lease payments.\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\n\u0026lt;a name=\u0026quot;ID562\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Mitigating factors\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;The following factors partially mitigate the transaction's weaknesses in our view:\u0026lt;/p\u0026gt;\u0026lt;ul\u0026gt;\u0026lt;li\u0026gt;The letters of credit available to the beneficiary Wells Fargo Bank, as indenture trustee, which can be used to partially pay down the notes in the event of a construction period event of default;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;Amazon's strong credit quality, with an S\u0026amp;amp;P Global Ratings issuer credit rating of 'AA', reflecting its strong business risk profile and minimal financial risk profile;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The construction agency agreements relating to the 11 development properties and substantially completed properties, which align Amazon's interests with those of noteholders by requiring Amazon to complete construction on warehouses for which they have already signed leases and fund any construction expenses that exceed 100% of the budgeted amounts;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The date-certain lease language for the development properties, which requires the tenant to begin paying rent no later than the specified lease start dates, regardless of the status of construction;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The tenant's requirement to maintain comprehensive insurance coverage, including at least 12 months of business interruption insurance, which could temporarily cover lost cash flow if Amazon optionally terminates a lease due to an event of casualty damage to a related property during the last year of a lease term requiring more than 60 days to repair; \u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The remoteness of condemnation, given the extensive coordination with local municipal authorities, including planning and permitting, conducted as part of each property's development process; \u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The cash reserve account, which will be funded with at least $11.0 million in cash at closing, an amount that should be sufficient to cover any short-term negative carry for the notes caused by the fact that initial cash flows from the development properties are limited to capitalized interest;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The liquidity reserve account which, if any notes are outstanding after the anticipated repayment date, will be funded through the waterfall (capped each month at 6.0% of available amounts remaining after allocating to collateral pool expenses and note interest) until it reaches 3.0% of the outstanding principal balance of the notes;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The maintenance capital expenditure reserve account, which will be funded at the top of the waterfall if any notes are outstanding after the anticipated repayment date, in an amount equivalent to $0.1667/modified NNN sq. ft. per month until the amount in the account reaches the target amount of $19.00 million;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The properties' general design, which is modular and may allow for greater flexibility when searching for potential replacement tenants;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The environmental site assessments completed for each property, revealing no material adverse environmental conditions, as well as typical lease indemnifications by the tenant relating to various liabilities at the properties, including potential environmental conditions;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;The significant deleveraging during the initial lease terms, especially during early amortization periods if any class of notes remains outstanding after its ARD; and\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;S\u0026amp;amp;P Global Ratings' cash flow stress assumptions, which gave credit to no more than 30 years of cash flows, demonstrating timely interest and ultimate principal payments on the notes by legal final maturity in all scenarios.\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\n\n\u0026lt;a name=\u0026quot;ID597\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Business Description: New Economy Assets \u0026ndash; Phase 1 Issuer LLC \u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;The sponsor, an indirect wholly owned subsidiary of funds and accounts managed by US RE Co. LLC (USAARE), a global investment firm with over $29.0 billion of assets under management, is securitizing a portfolio of net leases associated with warehouse facilities leased to Amazon. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;USAARE has partnered with Amazon to provide new logistics warehouse properties, all of which will have Amazon as the sole initial tenant. The current securitization pool is composed of 13 properties, five of which are completed or substantially completed, and eight of which are currently under construction (i.e., development properties), accounting for about 73.29% of the appraisal value of the underlying pool. The pool contains seven order fulfillment centers, five last-mile delivery (LMD) centers, and one outbound cross-dock. The fulfillment centers have original lease terms of 20 years, the LMD properties have original terms between 10.3 and 20 years, and the outbound cross-dock has an original lease term of 15 years. All but two of the properties possess five contractual extension options of five years. The remaining two properties have two and four extension options of five years, respectively. The leases are NNN and modified-NNN leases. Under the NNN leases, Amazon is required to pay all property-level expenses, including business expenses, real estate taxes, utilities, insurance, and repairs and maintenance. For the modified-NNN leases, the landlord is responsible for structural repairs and maintenance, including roof repair and replacement, as well as ancillary expenses such as landscaping and painting. Leases in this transaction contain indemnifications by the tenant relating to various liabilities, including environmental conditions.\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID605\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Underwriting, Collection, And Property Management Process\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;New Economy Assets \u0026ndash; Phase 1 Issuer LLC, the sponsor, property manager, and special servicer, is an indirect wholly owned subsidiary of various funds and accounts managed by affiliates of USAARE, tasked with owning, developing, financing, and managing the logistics facilities. New Economy Assets \u0026ndash; Phase 1 Issuer LLC provides property management services, and services the leases and the lease guarantees in accordance with their respective terms on behalf of the issuer and indenture trustee.\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID611\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Macroeconomic Outlook\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;S\u0026amp;amp;P Global Ratings expects the real GDP to grow 5.7% in 2021 and an additional 4.1% in 2022. Generally, the U.S. economy has cooled somewhat since its summertime peak when the economy benefitted from pent-up demand. Presently, supply disruptions, along with the resurgence of the COVID-19 Delta variant, have slowed economic growth. Economic data also suggest early-summer activity and travel is waning from peak levels several months ago. Still, the current forecast of 5.7% GDP growth, if correct, is still the highest reading since 1984. Our assessment indicates that the risk of a U.S. recession over the next 12 months currently stands at 10%-15%. We expect job numbers to return to pre-pandemic levels by fourth-quarter 2022, and that the Federal Reserve will implement a policy rate hike in December 2022, with two additional rate hikes per annum in 2023 and 2024. Though these assumptions reflect the most up-to-date information available, we recognize that the projected recovery remains fragile.\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID617\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Industry Characteristics: Sector Outlook\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;S\u0026amp;amp;P Global Ratings expects favorable demand tailwinds to persist for industrial real estate investment trusts (REITs) as e-commerce and LMD continue to support demand. Industrial properties are expected to remain resilient, having suffered less than retail and office properties during the COVID-19 pandemic, owing to their high-quality tenants and their mission-critical nature. Among the different REIT property types, retail REITs were hit particularly hard during the pandemic. Still, total rent collections have rebounded from their trough at close to 55% early in the pandemic. Industrial REITs, on the other hand, fared significantly better and maintained upward of 90% of their expected rent collections over the same period. In addition to sustained rent collections throughout the pandemic, the industrial real estate market has experienced elevated levels of transaction volume, specifically for tenants in essential industries, including food and beverage, health care, consumer products, and e-commerce. It is expected that industrial REITs will continue to perform favorably, primarily driven by strong, if not increasing, e-commerce demand, of which Amazon is an obvious benefactor. Additionally, though we expect that the industrial REIT space will experience some pressure on re-leasing spreads and occupancy rates over the next year or two, these predictions are less relevant to the current deal, as the earliest lease expiration in the pool is not until 2031.\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID623\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Logistics Real Estate\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;The proliferation of e-commerce and increasing customer demands for rapid delivery service have fundamentally changed the supply chain infrastructure required to support e-commerce delivery networks. Amazon itself is a case-in-point, having expanded its warehouse space by an order of magnitude in the last decade. This trend has been true for the larger e-commerce supply network as well. Since 2010, the American warehouse market has absorbed an average of 222 million sq. ft. of space per annum, the highest in history. CBRE Group Inc. reported an overall industrial vacancy rate of 4.0% as of September 2021, the lowest vacancy rate on record. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;In the past, warehouse rental rates were closely related to the strength of the broader economy, increasing until the top of the cycle and falling when the cycle turned. In the last decade, however, this relationship has weakened. Rather than being motivated by short-term economic considerations, e-commerce companies are investing in their supply chains to strengthen their long-term business strategy. Real estate investment is occurring in all phases of the cycle, and with considerable urgency. This, when combined with ever-fewer options for ideal warehouse build sites (i.e., ample space close to major population centers), has increased the average warehouse yearly rent escalation to approximately 9.7% from August 2020 levels. Perhaps even more in demand are LMD centers. Though they have only come into play in the last few years, LMDs are a key link needed to make any rapid delivery network a reality. As such, these properties continue to command a significant premium and are expected to have annual rent escalations of roughly 7.0%-8.0% over the next decade. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;The changing demand trends for warehouses has shifted how these properties are valued. This is particularly true for Amazon, which, given its goal of building out its distribution network, has every incentive to not vacate a given property within its network. Still, in the event that Amazon were to exit a property, it is reasonable to expect that another e-commerce player would capitalize on the opportunity, and quickly. Given these high levels of demand, which are expected to continue into the long term, warehouse appraisals employing the direct capitalization method have begun assuming a reversion cap rate up to 25 basis points above the typical reversion cap rate. \u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID633\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Amazon\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;On June 10, 2021, S\u0026amp;amp;P Global Ratings' raised its rating on Amazon to 'AA' from 'AA-'. The upgrade was supported by the Amazon's sustained, strong revenue, and the projection of healthy profit growth in the coming years. The company continues to lead the field in both its e-commerce division and its web service platform. On the e-commerce front, the company benefits from its diversified worldwide operations and its investments in technology and distribution. Its Prime membership, which entitles the holder to free two-day delivery -- and more recently, one-day shipping on millions of items -- has more than 200 million members and is growing. Although Amazon continues to enjoy a leading market position, other retail players (namely Target and Walmart) have recently gained traction, offering services (i.e., expedited shipping times and other amenities) that are in line with Amazon's policies and, more broadly, customers' high expectations. In 2020, Amazon's shipping costs increased by 61.2% to $61.1 billion from $37.9 billion in 2019, primarily due to increased utilization of free and expedited shipping services by its customers. On a six-month year-to-date basis, shipping costs increased 41.9% to $34.9 billion from $24.6 billion for the periods ending June 30, 2020 and 2021, respectively. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Amazon remains committed to heavy capital spending and acquisitions to meet customer demand and to maintain its leading market position. Though the company is not committed to a particular corporate credit rating, its current performance and sizeable cash balances are supportive of the 'AA' ICR. \u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Amazon has operated with a strategy of establishing a distribution network that can reach the majority of U.S. consumers within two days (or even one day). Understandably, this goal comes at a high cost and requires significant capital investments to be feasible. As evidenced by the current portfolio of leased properties, Amazon is in the process of investing heavily in its distribution network and is working to establish the fulfillment and LMD centers necessary to solidify its claim to nationwide two- and same-day delivery. For more information, see \u0026quot;\u0026lt;a href=\u0026quot;/ratings/en/regulatory/article/-/view/sourceId/11988721\u0026quot;\u0026gt;Amazon.com Inc. Upgraded To 'AA' From 'AA-' On Sustained Revenue, Profit Expansion Trajectory; Outlook Stable\u0026lt;/a\u0026gt;,\u0026quot; published June 10, 2021\n\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Given the concentrated exposure to various subsidiaries of Amazon, whose lease obligations and remaining construction milestones are explicitly and unconditionally guaranteed by Amazon, our ratings on the securitization's notes will be constrained to Amazon's ICR. The ratings could, however, fall further beneath Amazon's ICR should our view of the property values or expected lease cash flows following the end of Amazon's initial lease terms change.\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID652\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Pool And Structural Characteristics\u0026lt;/h4\u0026gt;\n\u0026lt;p\u0026gt;For the noteholders' benefit, the asset-owning entities will grant the indenture trustee a mortgage and assignment of leases in each of the properties included in the initial collateral pool (see table 1). Over the life of the transaction, the issuer may also substitute out certain \u0026quot;exchange properties\u0026quot; in exchange for \u0026quot;qualified substitute properties,\u0026quot; subject to specific criteria that maintain the pool's characteristics, such as being located in the U.S. or Canada, being a NNN or modified-NNN lease, being owned directly or indirectly by one of the asset-owning entities or leased under an unencumbered ground lease, satisfying environmental reviews, and being free of tax liens and any other negative pledges.\u0026lt;/p\u0026gt;\u0026lt;h4 class=\u0026quot;tableHeader\u0026quot;\u0026gt;Table 1\u0026lt;/h4\u0026gt;\u0026lt;table border=\u0026quot;0\u0026quot; cellspacing=\u0026quot;0\u0026quot; cellpadding=\u0026quot;0\u0026quot; class=\u0026quot;article \u0026quot;\u0026gt;\n\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th class=\u0026quot;tableTitle\u0026quot; colspan=\u0026quot;11\u0026quot;\u0026gt;\nInitial Asset Pool\u0026lt;/th\u0026gt;\n\n\n\n\n\n\n\n\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th\u0026gt;\nProperty Type\u0026lt;/th\u0026gt;\n\u0026lt;th\u0026gt;\nCity\u0026lt;/th\u0026gt;\n\u0026lt;th\u0026gt;\nState\u0026lt;/th\u0026gt;\n\u0026lt;th\u0026gt;\nRent commencement date\u0026lt;/th\u0026gt;\n\u0026lt;th\u0026gt;\nLease expiration\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nWA remaining lease term (years)\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nInitial base annual rent ($)\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nInitial base annual rent as a % of total\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAli 0026quot;\u0026gt;\n100.00 \u0026lt;/td\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td colspan=\u0026quot;23\u0026quot; class=\u0026quot;tableFootnote\u0026quot;\u0026gt;\nWA--Weighted average.\u0026lt;/td\u0026gt;\n\n\n\n\n\n\n\n\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;/table\u0026gt;\n\t\t\n\u0026lt;a name=\u0026quot;ID1542\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Development properties\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;The asset portfolio includes eight development properties that are not substantially completed properties (five fulfillment centers, two LMDs, and one outbound cross-dock), which have budgeted construction costs that are estimated to be 14%-75% funded as of the Aug. 31, 2021, statistical disclosure date pursuant to each construction agency agreement. An amount sufficient to fund 100% of remaining budgeted construction costs has been reserved in the securitization's development property and development property overage accounts. The development properties are expected by the sponsor to reach full completion status between January 2022 and June 2023, with leases paying rent on a similar timeframe. Once the leases commence, the eight development properties that are not substantially completed properties are expected to account for approximately 72.9% of rental cash flows from the collateral pool. \u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID1548\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Construction agency agreement\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;In accordance with the construction agency agreements between Amazon subsidiary Amazon.com Services LLC and the asset entities for the related development properties, Amazon is responsible for the design and construction of the development properties while the asset-owning entity is responsible for funding up to 100% of the budgeted construction costs. The asset-owning entity is obligated to fund the construction based on the actual construction costs incurred by Amazon. This obligation will be fully funded and is expected to be in the amount of $1.096 billion deposited to the transaction's development property account as of close, although this amount may change before transaction close. Amazon is responsible for the rent once leases commence, regardless of the construction status of the development properties, and pays capitalized interest during the construction period based on cumulative construction cost funded each month.\u0026lt;/p\u0026gt;\n\u0026lt;a name=\u0026quot;ID1554\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Construction risk\u0026lt;/h5\u0026gt;\n\u0026lt;p\u0026gt;Construction risk is fully mitigated, in our opinion, by the transaction's ability to draw on development property letters of credit provided independently by Goldman Sachs Bank USA and Barclays Bank plc for each development property that is not substantially complete as of the closing date. The letters of credit are sized to 104% of the budget construction costs (this amount equaling the Construction Purchase Price) for the respective development properties and must be drawn for any development property not completed within 14 months and 10 business days following the scheduled rent commencement date. All draw proceeds will be applied as unscheduled principal payment amounts.\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Amazon also guarantees its obligation to pay the construction purchase price given the declaration of a construction period event of default. Furthermore, given that Amazon is not only the construction agent but also the tenant, obligated to pay rent beginning on the date-certain dates regardless of construction status, we believe Amazon has strong incentives to complete construction as close to the lease start dates as possible. In our opinion, these factors make it unlikely that any construction will not be completed, however the letters of credit offer another layer of protection should Amazon not complete construction.\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Table 2 shows the pool characteristics relative to those of other single-tenant NNN-lease ABS transactions S\u0026amp;amp;P Global Ratings has rated.\u0026lt;/p\u0026gt;\u0026lt;h4 class=\u0026quot;tableHeader\u0026quot;\u0026gt;Table 2\u0026lt;/h4\u0026gt;\u0026lt;table border=\u0026quot;0\u0026quot; cellspacing=\u0026quot;0\u0026quot; cellpadding=\u0026quot;0\u0026quot; class=\u0026quot;article \u0026quot;\u0026gt;\n\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;th class=\u0026quot;tableTitle\u0026quot; colspan=\u0026quot;10\u0026quot;\u0026gt;\nPool Characteristics(i)\u0026lt;/th\u0026gt;\n\n\n\n\n\n\n\n\n\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt; \u0026lt;/td\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nNew Economy Assets - Phase 1 Issuer LLC (2021-1)\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nCF Hippolyta Issuer LLC (2021-1)\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nOak Street (2021-1)\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nCMFT 2021-1\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nCARS DB4 L.P. (2021-1)\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nCARS MTI-1 2020-1\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nSTORE 2021-1\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nAFN (2021-1)\u0026lt;/th\u0026gt;\n\u0026lt;th class=\u0026quot;colAlignRight\u0026quot;\u0026gt;\nNADG (2019-1)\u0026lt;/th\u0026gt;\n\u0026lt;/tr\u0026gt;\n\u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n\u0026lt;td class=\u0026quot;Ta
