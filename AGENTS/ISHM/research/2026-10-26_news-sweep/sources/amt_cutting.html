get":null},{"__typename":"Navs","title":"AMT About Us Careers Nav 6","ctaText":"Careers","link":"/about-us/careers","target":null}]}}]}}}]}}},"h":{},"s":200,"st":"OK","u":"https://graphql.contentful.com/content/v1/spaces/9izvyg3pqx53/environments/master","rt":"json"},"3691183621":{"b":{"data":{"articleCollection":{"__typename":"ArticleCollection","items":[{"sys":{"publishedAt":"2026-10-21T14:00:17.992Z","__typename":"Sys"},"__typename":"Article","keywords":["supply-chain-reinforcement","automotive-market","cutting-tool-market-report","press-release"],"slug":"august-2026-us-cutting-tool-shipments-totaled-278-6m-up-32-2-from-august-2025","title":"August 2026 US Cutting Tool Shipments Totaled $278.6M, Up 32.2% From August 2025","hideExcerptArticlePage":null,"hideFtImageLandingPage":null,"hideFtImageArticlePage":null,"publishedDate":"2026-10-21T10:00:00.000-05:00","canonicalTag":null,"author":{"sys":{"id":"6mAyFOaeWWQ7CVsGvjUNoL","__typename":"Sys"},"__typename":"Person","profilePicture":null,"name":"Chase Sires","slug":"chase-sires","jobTitle":"Senior Analyst","bio":null,"linkedin":"https://www.linkedin.com/in/chase-sires","twitter":null,"facebook":null},"keywordListCollection":{"__typename":"ArticleKeywordListCollection","items":[{"__typename":"Keyword","keywordId":"cutting-tool-market-report","title":"Cutting Tool Market Report"},{"__typename":"Keyword","keywordId":"press-release","title":"Press Release"},{"__typename":"Keyword","keywordId":"supply-chain-reinforcement","title":"Supply Chain Reinforcement"},{"__typename":"Keyword","keywordId":"automotive-market","title":"Automotive Market"}]},"body":{"json":{"nodeType":"document","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"","marks":[],"data":{}},{"nodeType":"asset-hyperlink","data":{"target":{"sys":{"id":"3nX2XVdnXUNVGffQ4zJZiv","type":"Link","linkType":"Asset"}}},"content":[{"nodeType":"text","value":"READ FULL PRESS RELEASE.","marks":[],"data":{}}]},{"nodeType":"text","value":"","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"McLean, Va. (October 21, 2026) — Shipments of cutting tools, as measured by the Cutting Tool Market Report, a collaboration between AMT – The Association For Manufacturing Technology and the U.S. Cutting Tool Institute (USCTI), totaled $278.6 million in August 2026. The value of shipments decreased 0.8% from the $280.9 million reported in July 2026 but was up 32.2% from August 2025. Year-to-date shipments totaled $2.03 billion, up 22.4% from the same period in 2025. Unit shipments in August remained steady with little movement in the past three months.","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"“Through the first eight months of 2026, our industry has experienced significant double-digit growth,” said Mike Stokey, president of USCTI and executive vice president and owner of cutting tool manufacturer Allied Machine & Engineering. “As I previously stated, much of this growth is due to skyrocketing raw material costs, which have caused inflation in the industry. Even without inflation, we are still experiencing significant growth, and this appears to be driven by the U.S. economy. Although APT pricing has stabilized for the moment, supply continues to be a concern. The leadership team of USCTI plans to remain active in Washington, D.C., indefinitely, and we will continue to work with the administration on raw material tariffs, which impact our ability to compete in a global market. We continue to be optimistic as we move forward.”","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"“Cutting tool shipments have increased 20.4% since July 2025. During the last expansion of cutting tool demand that began in March 2021, shipments continued to accelerate for 27 months after orders of new machinery went into contraction. Investment in new metalworking machinery, as measured by the ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"https://amtonline.org/topic/intelligence/usmto-press-releases"},"content":[{"nodeType":"text","value":"U.S. Manufacturing Technology Orders Report","marks":[],"data":{}}]},{"nodeType":"text","value":", is two years into a still-accelerating expansion,” said Christopher Chidzik, principal economist of AMT – The Association For Manufacturing Technology. “While material cost pressures have inflated the market, there is still a strong base of underlying demand for cutting tools. The average number of new metalworking machines ordered each month has increased 16% since July 2025, when cutting tool orders began their current expansion, which is growing the total stock of machinery that requires tooling. Factoring out price increases, year-to-date shipments through August 2026 were up 12.5% from the same period in 2025.”","marks":[],"data":{}}]},{"nodeType":"embedded-asset-block","data":{"target":{"sys":{"id":"7HcaN0Qp3j5Ylo0mK3AA9B","type":"Link","linkType":"Asset"}}},"content":[]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"The Cutting Tool Market Report is jointly compiled by AMT and USCTI, two trade associations representing the development, production, and distribution of cutting tool technology and products. It provides a monthly statement on U.S. manufacturers’ consumption of the primary consumable in the manufacturing process, the cutting tool. Cutting tool consumption is a leading indicator of both upturns and downturns in U.S. manufacturing activity, as it is a true measure of actual production levels.","marks":[],"data":{}}]},{"nodeType":"hr","data":{},"content":[]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"AMT – The Association For Manufacturing Technology ","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":"represents U.S.-based providers of manufacturing technology – the advanced machinery, devices, and digital equipment that U.S. manufacturing relies on to be productive, innovative, and competitive. Located in McLean, Virginia, near the nation’s capital, AMT acts as the industry’s voice to accelerate the pace of innovation, increase global competitiveness, and develop manufacturing’s advanced workforce of tomorrow. With extensive expertise in industry data and market intelligence, as well as a full complement of international business operations, AMT offers its members an unparalleled level of support. AMT also produces IMTS – The International Manufacturing Technology Show, the premier manufacturing technology event in North America. Learn more at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"http://www.AMTonline.org"},"content":[{"nodeType":"text","value":"AMTonline.org","marks":[],"data":{}}]},{"nodeType":"text","value":".","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"The United States Cutting Tool Institute (USCTI)","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" was formed in 1988 and resulted from a merger of the two national associations representing the cutting tool manufacturing industry. USCTI works to represent, promote, and expand the U.S. cutting tool industry and to promote the benefits of buying American-made cutting tools manufactured by its members. The Institute recently expanded its by-laws to include any North American manufacturer and/or remanufacturer of cutting tools, as well as post-fabrication tool surface treatment providers. Members, which number over 80, belong to seven product divisions: Carbide Tooling, Drill & Reamer, Milling Cutter, PCD & PCBN, Tap & Die, Tool Holder and All Other Tooling. A wide range of activities includes a comprehensive statistics program, human resources surveys and forums, development of product specifications and standards, and semi-annual meetings to share ideas and receive information on key industry trends. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"# # #","marks":[],"data":{}}]}]},"__typename":"ArticleBody","links":{"__typename":"ArticleBodyLinks","entries":{"__typename":"ArticleBodyEntries","inline":[],"block":[]},"assets":{"__typename":"ArticleBodyAssets","hyperlink":[{"sys":{"id":"3nX2XVdnXUNVGffQ4zJZiv","__typename":"Sys"},"__typename":"Asset","fileName":"10_2026_CTMR_PressRelease.pdf","url":"https://assets.ctfassets.net/9izvyg3pqx53/3nX2XVdnXUNVGffQ4zJZiv/7c01826d4eb9d55eb1b05d9115c433e0/10_2026_CTMR_PressRelease.pdf","title":"10 2026 CTMR PressRelease"}],"block":[{"sys":{"id":"7HcaN0Qp3j5Ylo0mK3AA9B","__typename":"Sys"},"__typename":"Asset","desktop":"https://images.ctfassets.net/9izvyg3pqx53/7HcaN0Qp3j5Ylo0mK3AA9B/aa287d2f06eebb5ad538eca249874352/CTMR_102026_01.png?w=800&q=90&fit=fill&f=CENTER","mobile":"https://images.ctfassets.net/9izvyg3pqx53/7HcaN0Qp3j5Ylo0mK3AA9B/aa287d2f06eebb5ad538eca249874352/CTMR_102026_01.png?w=375&q=90&fit=fill&f=CENTER","fileName":"CTMR 102026 01.png","url":"https://images.ctfassets.net/9izvyg3pqx53/7HcaN0Qp3j5Ylo0mK3AA9B/aa287d2f06eebb5ad538eca249874352/CTMR_102026_01.png","altText":"","title":"CTMR 102026 01"}]}}},"category":{"__typename":"Category","categoryId":"cutting-tool-market-report","title":"Cutting Tool Market Report","parent":{"__typename":"Category","categoryId":"intelligence","title":"Intelligence"}},"featuredImage":{"__typename":"Media","title":"CTMR Cover","description":null,"asset":{"__typename":"Asset","url":"https://images.ctfassets.net/9izvyg3pqx53/46HuLNt8QGLEiz4UZq9Sqi/57f373e7ba21b6f54924cbd173ca4f00/CTMR_Logo_Cover.svg?w=800&q=90&fit=fill&f=CENTER"}}}]}}},"h":{},"s":200,"st":"OK","u":"https://graphql.contentful.com/content/v1/spaces/9izvyg3pqx53/environments/master","rt":"json"},"__nghData__":[{},{"t":{"5":"t0","15":"t1","22":"t5"},"c":{"5":[],"15":[],"22":[]}},{"t":{"7":"t10"},"c":{"7":[{"i":"t10","r":1,"t":{"1":"t11"},"c":{"1":[]}}]}},{"t":{"0":"t12"},"c":{"0":[]}},{"t": NVGffQ4zJZiv","type":"Link","linkType":"Asset"}}},"content":[{"nodeType":"text","value":"READ FULL PRESS RELEASE.","marks":[],"data":{}}]},{"nodeType":"text","value":"","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"McLean, Va. (October 21, 2026) — Shipments of cutting tools, as measured by the Cutting Tool Market Report, a collaboration between AMT – The Association For Manufacturing Technology and the U.S. Cutting Tool Institute (USCTI), totaled $278.6 million in August 2026. The value of shipments decreased 0.8% from the $280.9 million reported in July 2026 but was up 32.2% from August 2025. Year-to-date shipments totaled $2.03 billion, up 22.4% from the same period in 2025. Unit shipments in August remained steady with little movement in the past three months.","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"“Through the first eight months of 2026, our industry has experienced significant double-digit growth,” said Mike Stokey, president of USCTI and executive vice president and owner of cutting tool manufacturer Allied Machine & Engineering. “As I previously stated, much of this growth is due to skyrocketing raw material costs, which have caused inflation in the industry. Even without inflation, we are still experiencing significant growth, and this appears to be driven by the U.S. economy. Although APT pricing has stabilized for the moment, supply continues to be a concern. The leadership team of USCTI plans to remain active in Washington, D.C., indefinitely, and we will continue to work with the administration on raw material tariffs, which impact our ability to compete in a global market. We continue to be optimistic as we move forward.”","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"“Cutting tool shipments have increased 20.4% since July 2025. During the last expansion of cutting tool demand that began in March 2021, shipments continued to accelerate for 27 months after orders of new machinery went into contraction. Investment in new metalworking machinery, as measured by the ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"https://amtonline.org/topic/intelligence/usmto-press-releases"},"content":[{"nodeType":"text","value":"U.S. Manufacturing Technology Orders Report","marks":[],"data":{}}]},{"nodeType":"text","value":", is two years into a still-accelerating expansion,” said Christopher Chidzik, principal economist of AMT – The Association For Manufacturing Technology. “While material cost pressures have inflated the market, there is still a strong base of underlying demand for cutting tools. The average number of new metalworking machines ordered each month has increased 16% since July 2025, when cutting tool orders began their current expansion, which is growing the total stock of machinery that requires tooling. Factoring out price increases, year-to-date shipments through August 2026 were up 12.5% from the same period in 2025.”","marks":[],"data":{}}]},{"nodeType":"embedded-asset-block","data":{"target":{"sys":{"id":"7HcaN0Qp3j5Ylo0mK3AA9B","type":"Link","linkType":"Asset"}}},"content":[]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"The Cutting Tool Market Report is jointly compiled by AMT and USCTI, two trade associations representing the development, production, and distribution of cutting tool technology and products. It provides a monthly statement on U.S. manufacturers’ consumption of the primary consumable in the manufacturing process, the cutting tool. Cutting tool consumption is a leading indicator of both upturns and downturns in U.S. manufacturing activity, as it is a true measure of actual production levels.","marks":[],"data":{}}]},{"nodeType":"hr","data":{},"content":[]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"AMT – The Association For Manufacturing Technology ","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":"represents U.S.-based providers of manufacturing technology – the advanced machinery, devices, and digital equipment that U.S. manufacturing relies on to be productive, innovative, and competitive. Located in McLean, Virginia, near the nation’s capital, AMT acts as the industry’s voice to accelerate the pace of innovation, increase global competitiveness, and develop manufacturing’s advanced workforce of tomorrow. With extensive expertise in industry data and market intelligence, as well as a full complement of international business operations, AMT offers its members an unparalleled level of support. AMT also produces IMTS – The International Manufacturing Technology Show, the premier manufacturing technology event in North America. Learn more at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"http://www.AMTonline.org"},"content":[{"nodeType":"text","value":"AMTonline.org","marks":[],"data":{}}]},{"nodeType":"text","value":".","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"The United States Cutting Tool Institute (USCTI)","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" was formed in 1988 and resulted from a merger of the two national associations representing the cutting tool manufacturing industry. USCTI works to represent, promote, and expand the U.S. cutting tool industry and to promote the benefits of buying American-made cutting tools manufactured by its members. The Institute recently expanded its by-laws to include any North American manufacturer and/or remanufacturer of cutting tools, as well as post-fabrication tool surface treatment providers. Members, which number over 80, belong to seven product divisions: Carbide Tooling, Drill & Reamer, Milling Cutter, PCD & PCBN, Tap & Die, Tool Holder and All Other Tooling. A wide range of activities includes a comprehensive statistics program, human resources surveys and forums, development of product specifications and standards, and semi-annual meetings to share ideas and receive information on key industry trends. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"# # #","marks":[],"data":{}}]}]},"links":{"__typename":"ArticleBodyLinks","entries":{"__typename":"ArticleBodyEntries","inline":[],"block":[]},"assets":{"__typename":"ArticleBodyAssets","hyperlink":[{"__typename":"Asset","title":"10 2026 CTMR PressRelease","fileName":"10_2026_CTMR_PressRelease.pdf","url":"https://assets.ctfassets.net/9izvyg3pqx53/3nX2XVdnXUNVGffQ4zJZiv/7c01826d4eb9d55eb1b05d9115c433e0/10_2026_CTMR_PressRelease.pdf","sys":{"__ref":"Sys:3nX2XVdnXUNVGffQ4zJZiv"}}],"block":[{"__typename":"Asset","url({\"transform\":{\"quality\":90,\"resizeFocus\":\"CENTER\",\"resizeStrategy\":\"FILL\",\"width\":800}})":"https://images.ctfassets.net/9izvyg3pqx53/7HcaN0Qp3j5Ylo0mK3AA9B/aa287d2f06eebb5ad538eca249874352/CTMR_102026_01.png?w=800&q=90&fit=fill&f=CENTER","url({\"transform\":{\"quality\":90,\"resizeFocus\":\"CENTER\",\"resizeStrategy\":\"FILL\",\"width\":375}})":"https://images.ctfassets.net/9izvyg3pqx53/7HcaN0Qp3j5Ylo0mK3AA9B/aa287d2f06eebb5ad538eca249874352/CTMR_102026_01.png?w=375&q=90&fit=fill&f=CENTER","description":"","title":"CTMR 102026 01","fileName":"CTMR 102026 01.png","url":"https://images.ctfassets.net/9izvyg3pqx53/7HcaN0Qp3j5Ylo0mK3AA9B/aa287d2f06eebb5ad538eca249874352/CTMR_102026_01.png","sys":{"__ref":"Sys:7HcaN0Qp3j5Ylo0mK3AA9B"}}]}}},"author":{"__typename":"Person","name":"Chase Sires","slug":"chase-sires","jobTitle":"Senior Analyst","bio":null,"linkedin":"https://www.linkedin.com/in/chase-sires","twitter":null,"facebook":null,"profilePicture":null,"sys":{"__ref":"Sys:6mAyFOaeWWQ7CVsGvjUNoL"}},"publishedDate":"2026-10-21T10:00:00.000-05:00","sys":{"__typename":"Sys","publishedAt":"2026-10-21T14:00:17.992Z"},"canonicalTag":null}]},"categoryCollection({\"where\":{\"parent\":{\"categoryId\":\"cutting-tool-market-report\"}}})":{"__typename":"CategoryCollection","items":[]}},"Sys:3nX2XVdnXUNVGffQ4zJZiv":{"__typename":"Sys","id":"3nX2XVdnXUNVGffQ4zJZiv"},"Sys:7HcaN0Qp3j5Ylo0mK3AA9B":{"__typename":"Sys","id":"7HcaN0Qp3j5Ylo0mK3AA9B"},"Sys:6mAyFOaeWWQ7CVsGvjUNoL":{"__typename":"Sys","id":"6mAyFOaeWWQ7CVsGvjUNoL"}}}</script></body></html>
