<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Research calendar</title><style>
:root{--ink:#243b45;--muted:#687879;--paper:#f6f5ef;--line:#dadfd7;--market:#0e706e;--research:#3f668b;--followup:#86643d;--housekeeping:#7c7286}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #d07a40;outline-offset:3px}a{color:#176975;text-underline-offset:3px}.shell{max-width:1640px;margin:auto;padding:32px 36px}.mast{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:750;text-transform:uppercase;color:var(--muted)}h1{font:500 38px/1.15 Georgia,serif;margin:9px 0 10px}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}p{margin:0 0 12px}.intro{color:var(--muted);font-size:14px}.stamp{border:1px solid #cbd6ce;background:#eaf0e8;padding:8px 12px;border-radius:7px;font-size:12px;white-space:nowrap}.ribbon{margin:22px 0 18px;padding:15px 18px;border-left:3px solid #91a99c;background:#eaf0e8;font-size:14px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:16px 0}.layers,.view-controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.chip,.mode,.today,select{border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:transparent;font-size:12px}.chip[aria-pressed=true]{background:white;box-shadow:0 1px 2px #243b4508}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px}.chip[aria-pressed=false]{color:var(--muted);border-style:dashed}.mode[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}.small{font-size:12px;color:var(--muted)}.board-caption{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:22px 0 12px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.day{min-width:0;background:#eeeee6;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:480px}.day.weekend{background:transparent}.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 3px 16px}.dayhead strong{font:500 25px Georgia,serif}.dayhead span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.group-title{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:15px 2px 8px;font-weight:700}.card{display:block;text-align:left;width:100%;border:1px solid #dbe1da;border-top:3px solid var(--accent);background:#fffef9;border-radius:6px;padding:11px 10px;margin:0 0 9px;box-shadow:0 2px 3px #243b4505}.card:hover{border-bottom-color:var(--accent);box-shadow:0 3px 12px #243b4510;transform:translateY(-1px)}.card-time{font-size:10px;color:var(--accent);font-weight:700;display:block;margin-bottom:6px}.card-title{font-size:13px;line-height:1.35;font-weight:650;display:block}.card-note{display:block;font-size:10px;color:var(--muted);margin-top:9px;line-height:1.45}.linked{display:block;font-size:10px;margin-top:9px;color:#705336}.empty{font-size:12px;color:var(--muted);padding:12px 3px}.rails{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}.rail{padding:18px;border:1px solid var(--line);border-radius:9px}.rail h2{font-size:14px}.rail .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.rail .card{margin:0}.rail .small{margin-bottom:12px}.coverage{border-top:1px solid var(--line);padding:22px 0 8px;margin-top:8px}.coverage summary{cursor:pointer;font-size:13px;font-weight:650}.coverage-body{max-width:900px;padding:16px 0;font-size:13px;color:var(--muted)}.source-list{margin:10px 0;padding-left:20px;font-size:12px;overflow-wrap:anywhere}.footer{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:11px;padding-top:16px}.dayview{max-width:720px}.dayview .day{min-height:220px}.dayview .card{padding:16px}.dayview .card-title{font-size:16px}.dayview .card-note{font-size:12px}.notice{background:white;border:1px solid var(--line);padding:24px;border-radius:9px}.dialog{border:0;box-shadow:0 20px 100px #142b4140;max-width:580px;width:calc(100% - 28px);max-height:90vh;border-radius:12px;padding:0;background:#fffef9;color:var(--ink)}.dialog::backdrop{background:#132a3a68}.detail-head{position:sticky;top:0;background:#fffef9;padding:22px 26px 14px;border-bottom:1px solid var(--line);display:flex;gap:14px;justify-content:space-between;align-items:start}.detail-head h2{font:500 27px/1.2 Georgia,serif;margin:8px 0}.close{background:#f0f0e8;border:0;border-radius:50%;width:32px;height:32px;flex-shrink:0}.detail-body{padding:22px 26px}.detail-body p{font-size:14px}.detail-section{margin:0 0 24px}.detail-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:8px}.callout{padding:14px;border-radius:6px;background:#eef1e8}.source{border-top:1px solid var(--line);padding:10px 0;font-size:12px}.source summary{cursor:pointer;color:#176975}.source pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.6 ui-monospace,monospace;background:#f0f1eb;padding:12px;max-height:240px;overflow:auto}.tag{font-size:11px;background:#eff0e8;border-radius:4px;padding:4px 7px;display:inline-block;margin-right:5px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:1700px){.card-title{font-size:15px}.card-time,.card-note,.linked{font-size:11px}}
@media(max-width:1100px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}.day{min-height:280px}.shell{padding:24px}.card-title{font-size:14px}}
@media(max-width:650px){.shell{padding:20px 14px}.mast{align-items:flex-start}.stamp{white-space:normal;max-width:100px;font-size:10px}h1{font-size:30px}.week{grid-template-columns:1fr 1fr}.day{min-height:180px}.rails{grid-template-columns:1fr}.rail .cards{grid-template-columns:1fr}.footer{display:block}.toolbar{gap:12px}.chip{padding:8px}.board-caption{gap:12px}.detail-head,.detail-body{padding:18px}.card-title{font-size:13px}}
@media(prefers-reduced-motion:reduce){.card:hover{transform:none}}

:root{--unclassified:#686d82} .searchbar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.searchbar input{flex:1;min-width:200px;padding:10px;border:1px solid var(--line);border-radius:8px}.searchbar select{max-width:260px}.source pre{white-space:pre-wrap;overflow-wrap:anywhere}.coverage-body{overflow-wrap:anywhere}.coverage-body li{margin:9px 0}.ribbon[data-warning="true"]{border-left:4px solid #9a5b25;background:#fff5e9}.rail summary{cursor:pointer;font-weight:600}.toolbar{flex-wrap:wrap}.card-title{overflow-wrap:anywhere}.dayhead{cursor:pointer}.searchbar button{padding:9px}.coverage code{overflow-wrap:anywhere}#refresh[disabled]{opacity:.55}dialog .detail-body{overflow-wrap:anywhere}
.day,.rail,.toolbar>*,.card,.card-note,.card-time{min-width:0;overflow-wrap:anywhere}.card-title,.card-note,.card-time{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.card-title{-webkit-line-clamp:4}.card-note{-webkit-line-clamp:3}.card-time{-webkit-line-clamp:2}.rails{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:760px){.rails{grid-template-columns:minmax(0,1fr)}}
</style></head><body><main class="shell">
<header class="mast"><div><div class="eyebrow">CATO / Research calendar</div><h1>The week ahead.</h1><p class="intro" id="range">Loading calendar…</p></div><div class="stamp">Live local reader<br>Eastern time</div></header>
<div class="ribbon" id="status" role="status">Loading source records…</div>
<div class="searchbar"><button class="today" id="prev" aria-label="Previous week">← Previous</button><button class="today" id="next" aria-label="Next week">Next →</button><button class="today" id="today">Today</button><button class="today" id="refresh">Refresh sources</button><input id="search" type="search" aria-label="Search calendar" placeholder="Search events, agents and source text"><select id="owner" aria-label="Filter by owner"><option value="">All owners</option></select></div>
<div class="toolbar"><div class="layers" role="group" aria-label="Calendar layers" id="layers"></div><div class="view-controls" role="group" aria-label="View"><button class="mode" id="week-mode" aria-pressed="true">Week</button><button class="mode" id="day-mode" aria-pressed="false">Day</button><label class="sr-only" for="day-select">Choose a day</label><select id="day-select"></select></div></div>
<div class="board-caption"><span id="visible-count" aria-live="polite"></span><span>Open any card for its full record</span></div><section id="board" aria-label="Week calendar"></section><section id="rails" class="rails" aria-label="Windows and unresolved timing"></section>
<details class="coverage" id="coverage"><summary>Source coverage, freshness and missing work</summary><div class="coverage-body" id="coverage-body"></div></details><footer class="footer"><span>Source-owned records. Calendar presentation by CATO.</span><span>Read-only · no reminders or agent starts</span></footer>
</main><dialog class="dialog" id="detail" aria-labelledby="detail-title"><div class="detail-head"><div><div class="eyebrow" id="detail-category"></div><h2 id="detail-title"></h2><div id="detail-tags"></div></div><button class="close" id="close" aria-label="Close details">×</button></div><div class="detail-body" id="detail-body"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const layers={market:'Market events',research:'Desk research',followup:'Research follow-ups',housekeeping:'Housekeeping',unclassified:'Unclassified'};
const active=new Set(['market','research','followup','unclassified']);
let data=null, mode='week', selected='', week='', query='', owner='', lastFailure='', loading=false;
const iso=d=>d.toISOString().slice(0,10);
const shift=(s,n)=>{let d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const monday=s=>{let n=new Date(s+'T12:00:00Z').getUTCDay();return shift(s,-((n+6)%7))};
const dates=()=>Array.from({length:7},(_,i)=>shift(week,i));
const pretty=s=>new Date(s+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'});
const weekday=s=>new Date(s+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short'});
function filtered(e){return (!owner||e.owner===owner)&&(!query||[e.title,e.owner,e.why,e.work,e.note,...e.sources.map(s=>s.excerpt)].join(' ').toLowerCase().includes(query))}
function inWeek(e){return e.date&&e.date<=shift(week,6)&&(e.end||e.date)>=week}
function card(e){return `<button class="card" data-id="${esc(e.id)}" style="--accent:var(--${e.layer})"><span class="card-time">${esc(e.when)}</span><span class="card-title">${esc(e.title)}</span><span class="card-note">${esc(e.owner)}<br>${esc(e.confidence)}</span>${e.link?'<span class="linked">Recorded relevance attached</span>':e.work?'<span class="linked">Desk work attached</span>':''}</button>`}
function day(d){const rows=data.events.filter(e=>active.has(e.layer)&&filtered(e)&&e.date===d&&['timed','date'].includes(e.lane));let html='';for(const [lane,label] of [['timed','Scheduled releases'],['date','Other events & due work']]){const items=rows.filter(e=>e.lane===lane).sort((a,b)=>a.time.localeCompare(b.time));if(items.length)html+=`<div class="group-title">${label}</div>`+items.map(card).join('')}return `<article class="day" data-date="${d}"><div class="dayhead"><span>${weekday(d)}</span><strong>${Number(d.slice(-2))}</strong></div>${html||'<p class="empty">No matching loaded records.<br>Check source coverage below.</p>'}</article>`}
function status(){if(!data)return;const missing=data.coverage.filter(s=>s.status!=='loaded'),stale=data.coverage.flatMap(s=>s.warnings).filter(s=>s.startsWith('STALE:'));const age=(Date.now()-Date.parse(data.refreshed_at))/60000;let message=lastFailure?`Refresh failed. Showing the last loaded records: ${lastFailure}. `:'';message+=`Files read ${new Date(data.refreshed_at).toLocaleString('en-US',{timeZone:'America/New_York'})} ET. `;if(missing.length)message+=`${missing.length} source(s) unavailable; this view is incomplete. `;if(stale.length)message+=stale.join(' ')+' ';if(age>15)message+='This view is over 15 minutes old; refresh before planning. ';message+='Loading files does not reverify their schedules or evidence.';$('status').textContent=message;$('status').dataset.warning=String(!!lastFailure||missing.length>0||stale.length>0||age>15)}
function render(){if(!data)return;const ds=dates();$('range').textContent=`${pretty(week)} – ${pretty(ds[6])} · Eastern time (EST/EDT as applicable)`;$('day-select').innerHTML=ds.map(d=>`<option value="${d}" ${d===selected?'selected':''}>${weekday(d)} · ${pretty(d)}</option>`).join('');$('layers').innerHTML=Object.entries(layers).map(([k,v])=>{let n=data.events.filter(e=>e.layer===k&&filtered(e)).length;return `<button class="chip" data-layer="${k}" aria-pressed="${active.has(k)}" style="--accent:var(--${k})"><span class="dot"></span>${v} <span class="small">${n}</span></button>`}).join('');$('week-mode').setAttribute('aria-pressed',mode==='week');$('day-mode').setAttribute('aria-pressed',mode==='day');$('board').className=mode==='week'?'week':'dayview';$('board').innerHTML=(mode==='week'?ds:[selected]).map(day).join('');let html='';for(const [lane,title] of [['window','Across this week'],['uncertain','Timing needs checking'],['overdue','Earlier source records'],['undated','No date recorded']]){let rows=data.events.filter(e=>e.lane===lane&&active.has(e.layer)&&filtered(e)&&(lane==='window'?inWeek(e):true)).sort((a,b)=>a.date.localeCompare(b.date));html+=`<details class="rail" ${lane==='window'?'open':''}><summary>${title} · ${rows.length}</summary><p class="small">${lane==='window'?'Source windows retain both edges.':'Inventory across loaded sources; not limited to the selected week.'}</p><div class="cards">${rows.map(card).join('')||'<p class="empty">No matching loaded records.</p>'}</div></details>`}$('rails').innerHTML=html;const hidden=data.events.filter(e=>e.layer==='housekeeping'&&filtered(e)).length;const unclassified=data.events.filter(e=>e.layer==='unclassified').length;$('visible-count').textContent=`${$('board').querySelectorAll('.card').length} day-grid cards · ${unclassified} unclassified records${active.has('housekeeping')?'':` · ${hidden} housekeeping records hidden`}`;status()}
function section(label,body,cls=''){return body?`<section class="detail-section ${cls}"><div class="detail-label">${esc(label)}</div><p>${esc(body)}</p></section>`:''}
function openDetail(id){const e=data.events.find(e=>e.id===id);if(!e)return;$('detail-category').textContent=layers[e.layer];$('detail-title').textContent=e.title;$('detail-tags').innerHTML=`<span class="tag">${esc(e.when)}</span><span class="tag">${esc(e.confidence)}</span>`;let html=section('Why it matters',e.why)+section('Recorded relevance',e.link,'callout')+section('Work around this event',e.work)+section('Date evidence',e.verification)+section('Keep in view',e.note);html+='<div class="detail-label">Source records captured at this refresh</div>';for(const s of e.sources)html+=`<details class="source"><summary>${esc(s.path)} · line ${s.line}</summary><p class="small">File SHA-256 ${esc(s.sha256)}</p><pre>${esc(s.excerpt)}</pre><a href="/source?path=${encodeURIComponent(s.path)}" target="_blank" rel="noopener">Open current source (may be newer) ↗</a></details>`;$('detail-body').innerHTML=html;$('detail').showModal()}
async function refresh(){if(loading)return;loading=true;$('refresh').disabled=true;$('refresh').textContent='Reading sources…';const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),30000);try{const response=await fetch('/api/calendar',{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('source service returned '+response.status);const next=await response.json();if(!Array.isArray(next.events)||!Array.isArray(next.coverage))throw Error('invalid source response');data=next;lastFailure='';if(!week){week=monday(data.today);if(new Date(data.today+'T12:00Z').getUTCDay()%6===0)week=shift(week,7);selected=week}const owners=[...new Set(data.events.map(e=>e.owner))].sort();if(owner&&!owners.includes(owner))owner='';$('owner').innerHTML='<option value="">All owners</option>'+owners.map(o=>`<option ${o===owner?'selected':''}>${esc(o)}</option>`).join('');$('coverage-body').innerHTML=`<p>${esc(data.note)}</p><p>All registered catalyst ledgers are enumerated on each refresh. Other desk calendars, prose beyond HENRY’s dated table and unregistered catalysts are outside coverage. Unknown docket categories remain visible. Similar records remain separate unless an explicitly reviewed, unchanged source join exists.</p><ul>`+data.coverage.map(s=>`<li><strong>${esc(s.label)}: ${esc(s.status)} · ${s.count} source rows</strong><br><code>${esc(s.path)}</code>${s.warnings.map(w=>`<p>${esc(w)}</p>`).join('')}</li>`).join('')+'</ul>'+`<details><summary>Preview context not reused · ${data.context_notes.length}</summary><ul>${data.context_notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></details>`;if($('detail').open)$('detail').close();render()}catch(e){lastFailure=String(e.message||e);if(data)status();else{$('status').textContent='Calendar unavailable: '+lastFailure+'. No source coverage established.';$('status').dataset.warning='true'}}finally{clearTimeout(timeout);loading=false;$('refresh').disabled=false;$('refresh').textContent='Refresh sources'}}
document.addEventListener('click',event=>{const cardNode=event.target.closest('[data-id]');if(cardNode)openDetail(cardNode.dataset.id);const layer=event.target.closest('[data-layer]');if(layer){active.has(layer.dataset.layer)?active.delete(layer.dataset.layer):active.add(layer.dataset.layer);render()}const dayNode=event.target.closest('.dayhead');if(dayNode){selected=dayNode.parentElement.dataset.date;mode='day';render()}});
$('prev').onclick=()=>{week=shift(week,-7);selected=week;render()};$('next').onclick=()=>{week=shift(week,7);selected=week;render()};$('today').onclick=()=>{if(!data)return;selected=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});week=monday(selected);mode='day';render()};$('week-mode').onclick=()=>{mode='week';render()};$('day-mode').onclick=()=>{mode='day';render()};$('day-select').onchange=e=>{selected=e.target.value;mode='day';render()};$('search').oninput=e=>{query=e.target.value.toLowerCase();render()};$('owner').onchange=e=>{owner=e.target.value;render()};$('refresh').onclick=refresh;$('close').onclick=()=>$('detail').close();setInterval(status,60000);refresh();
</script></body></html>
