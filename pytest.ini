# Repository pytest settings (WQ-717 items 2 and 3, Will 2026-11-17; DAEDALUS 2026-11-18).
# Record: AGENTS/DAEDALUS/runs/2026-11-18_WQ717_TEST_REPAIRS.md
[pytest]
# Item 2: collect test_*.py only. Every tracked *_test.py file is a research or tool script, not a
# test (13 on 2026-11-18, listed in the record); collecting one runs its top-level code, and
# AGENTS/TERRY/research/2026-11-06_coupling-test/gas_test.py writes data/gas_closes.csv when it runs.
# A file named on the command line is still collected whatever its name.
python_files = test_*.py
# No .pytest_cache directory at the repository root (it would sit untracked in every desk's git status).
addopts = -p no:cacheprovider
# Item 3: tests that read live desk files carry this marker (applied by path in conftest.py).
# A failure in one may mean the data moved, not that the code broke. The marker changes nothing
# about whether they run: `pytest -m live_data` runs only them, `pytest -m "not live_data"` the rest.
markers =
    live_data: reads live desk files; a failure may mean the data moved, not that the code broke (WQ-717)
