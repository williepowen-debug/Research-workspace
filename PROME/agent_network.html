<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Network — Research System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/vis-network.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
        }
        #header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #30363d;
        }
        h1 {
            font-size: 24px;
            color: #58a6ff;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 14px;
        }
        #network {
            width: 100%;
            height: calc(100vh - 180px);
        }
        #legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 16px;
            flex-wrap: wrap;
            border-top: 1px solid #30363d;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .legend-line {
            width: 24px;
            height: 3px;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🔬 Research Agent Network</h1>
        <div class="subtitle">Transmission Chain: LABOR → CARL → REGINALD | Parallel: LIQUID, SAM, ZHAO</div>
    </div>
    <div id="network"></div>
    <div id="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background: #f85149;"></div>
            <span>RED / Critical</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #d29922;"></div>
            <span>ORANGE / Elevated</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #3fb950;"></div>
            <span>GREEN / Stable</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #58a6ff;"></div>
            <span>Orchestrator</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #8b949e;"></div>
            <span>Sub-Agent</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background: #f85149;"></div>
            <span>Primary Transmission</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background: #8b949e;"></div>
            <span>Data Flow</span>
        </div>
    </div>

    <script>
        // Node definitions
        var nodes = new vis.DataSet([
            // Orchestrator
            { id: 'prome', label: '🧠 PROME\nOrchestrator', color: '#58a6ff', font: { color: '#fff' }, shape: 'box', size: 35 },
            
            // Core transmission chain
            { id: 'labor', label: '👷 LABOR\nEmployment\n🔴 RED', color: '#f85149', font: { color: '#fff' }, shape: 'ellipse', size: 30 },
            { id: 'carl', label: '💳 CARL\nConsumer Credit\n🟠 ELEVATED', color: '#d29922', font: { color: '#fff' }, shape: 'ellipse', size: 30 },
            { id: 'reginald', label: '🏦 REGINALD\nRegional Banks\n🟠 ELEVATED', color: '#d29922', font: { color: '#fff' }, shape: 'ellipse', size: 30 },
            
            // Parallel channels
            { id: 'liquid', label: '💧 LIQUID\nFunding/Plumbing\n🟢 GREEN', color: '#3fb950', font: { color: '#fff' }, shape: 'ellipse', size: 28 },
            { id: 'sam', label: '🇯🇵 SAM\nJapan Macro\n🔴 RED', color: '#f85149', font: { color: '#fff' }, shape: 'ellipse', size: 28 },
            { id: 'zhao', label: '🇨🇳 ZHAO\nChina Macro\n✅ COMPLETE', color: '#3fb950', font: { color: '#fff' }, shape: 'ellipse', size: 28 },
            { id: 'hans', label: '🇪🇺 HANS\nEurope\n✅ COMPLETE', color: '#3fb950', font: { color: '#fff' }, shape: 'ellipse', size: 28 },
            
            // Market monitoring
            { id: 'henry', label: '📊 HENRY\nMarket Structure\n🟡 YELLOW', color: '#d29922', font: { color: '#fff' }, shape: 'diamond', size: 25 },
            
            // Support agents
            { id: 'marco', label: '🚶 MARCO\nMigration/Labor\n🟠 ORANGE', color: '#d29922', font: { color: '#fff' }, shape: 'ellipse', size: 24 },
            
            // Sub-agents (REGINALD)
            { id: 'creed', label: 'CREED\nCRE/Office', color: '#8b949e', font: { color: '#fff' }, shape: 'box', size: 18 },
            { id: 'brock', label: 'BROCK\nBDC/Private Credit', color: '#8b949e', font: { color: '#fff' }, shape: 'box', size: 18 },
            { id: 'tex', label: 'TEX\nTexas Stress', color: '#8b949e', font: { color: '#fff' }, shape: 'box', size: 18 },
            { id: 'coral', label: 'CORAL\nFL Banks/SSB', color: '#8b949e', font: { color: '#fff' }, shape: 'box', size: 18 },
            
            // Sub-agents (CARL)
            { id: 'gig', label: 'GIG\nGig Economy', color: '#8b949e', font: { color: '#fff' }, shape: 'box', size: 18 },
            
            // Positions
            { id: 'positions', label: '📈 POSITIONS\nKRE | SSB | IWM | HYG', color: '#a371f7', font: { color: '#fff' }, shape: 'box', size: 22 }
        ]);

        // Edge definitions
        var edges = new vis.DataSet([
            // Core transmission chain (thick red arrows)
            { from: 'labor', to: 'carl', arrows: 'to', color: { color: '#f85149' }, width: 4, label: 'triggers' },
            { from: 'carl', to: 'reginald', arrows: 'to', color: { color: '#f85149' }, width: 4, label: 'converts to' },
            
            // PROME orchestrates all
            { from: 'prome', to: 'labor', arrows: 'to', color: { color: '#58a6ff' }, width: 2, dashes: true },
            { from: 'prome', to: 'carl', arrows: 'to', color: { color: '#58a6ff' }, width: 2, dashes: true },
            { from: 'prome', to: 'reginald', arrows: 'to', color: { color: '#58a6ff' }, width: 2, dashes: true },
            { from: 'prome', to: 'liquid', arrows: 'to', color: { color: '#58a6ff' }, width: 2, dashes: true },
            { from: 'prome', to: 'sam', arrows: 'to', color: { color: '#58a6ff' }, width: 2, dashes: true },
            { from: 'prome', to: 'henry', arrows: 'to', color: { color: '#58a6ff' }, width: 2, dashes: true },
            
            // Parallel channels to LIQUID
            { from: 'sam', to: 'liquid', arrows: 'to', color: { color: '#8b949e' }, width: 2, label: 'UST flows' },
            { from: 'zhao', to: 'liquid', arrows: 'to', color: { color: '#8b949e' }, width: 2, label: 'Belgium proxy' },
            { from: 'hans', to: 'liquid', arrows: 'to', color: { color: '#8b949e' }, width: 2, label: 'EUR/UST' },
            
            // LIQUID amplifies
            { from: 'liquid', to: 'reginald', arrows: 'to', color: { color: '#d29922' }, width: 3, label: 'amplifies' },
            
            // SAM independent trigger
            { from: 'sam', to: 'henry', arrows: 'to', color: { color: '#f85149' }, width: 2, label: 'carry unwind' },
            
            // HENRY monitors all
            { from: 'henry', to: 'positions', arrows: 'to', color: { color: '#a371f7' }, width: 2 },
            { from: 'reginald', to: 'positions', arrows: 'to', color: { color: '#a371f7' }, width: 2 },
            
            // MARCO feeds LABOR
            { from: 'marco', to: 'labor', arrows: 'to', color: { color: '#8b949e' }, width: 2, label: 'migration data' },
            
            // Sub-agents
            { from: 'reginald', to: 'creed', arrows: 'to', color: { color: '#8b949e' }, width: 1 },
            { from: 'reginald', to: 'brock', arrows: 'to', color: { color: '#8b949e' }, width: 1 },
            { from: 'reginald', to: 'tex', arrows: 'to', color: { color: '#8b949e' }, width: 1 },
            { from: 'reginald', to: 'coral', arrows: 'to', color: { color: '#8b949e' }, width: 1 },
            { from: 'carl', to: 'gig', arrows: 'to', color: { color: '#8b949e' }, width: 1 },
            
            // Cross-connections
            { from: 'hans', to: 'sam', arrows: 'to,from', color: { color: '#8b949e' }, width: 1, label: 'rate diff' },
            { from: 'zhao', to: 'sam', arrows: 'to,from', color: { color: '#8b949e' }, width: 1, label: 'Asia flows' }
        ]);

        // Create network
        var container = document.getElementById('network');
        var data = { nodes: nodes, edges: edges };
        var options = {
            physics: {
                enabled: true,
                solver: 'forceAtlas2Based',
                forceAtlas2Based: {
                    gravitationalConstant: -80,
                    centralGravity: 0.01,
                    springLength: 150,
                    springConstant: 0.08
                },
                stabilization: {
                    iterations: 200
                }
            },
            nodes: {
                borderWidth: 2,
                borderWidthSelected: 4,
                font: {
                    size: 12,
                    face: 'arial',
                    multi: 'html'
                }
            },
            edges: {
                font: {
                    size: 10,
                    color: '#8b949e',
                    strokeWidth: 0
                },
                smooth: {
                    type: 'curvedCW',
                    roundness: 0.2
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 200
            }
        };
        
        var network = new vis.Network(container, data, options);
    </script>
</body>
</html>
