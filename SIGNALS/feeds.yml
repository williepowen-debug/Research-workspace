# SENTRY Feed Configuration
# Edit this file to add/remove feeds. GitHub Action picks up changes on next run.
#
# Per-feed fields:
#   name: human-readable feed name
#   url: RSS/Atom URL
#   tags: list of #tags applied to all items from this feed
#   enabled: true|false
#   headers: optional dict of HTTP headers (e.g., User-Agent for SEC compliance)
#   include_types: optional whitelist of title-prefix strings; entries whose
#     title doesn't start with one of these (followed by " - ") are dropped.
#     Used to filter SEC EDGAR's noisy getcurrent feed down to high-signal forms.

feeds:
  - name: "EIA Today in Energy"
    url: "https://www.eia.gov/rss/todayinenergy.xml"
    tags: ["energy", "brent", "eia"]
    enabled: true

  # SEC EDGAR — global getcurrent feed, filtered to high-signal forms only.
  # Per https://www.sec.gov/os/accessing-edgar-data, requests must include a
  # UA identifying the requester with contact info.
  - name: "SEC EDGAR Filings"
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=&company=&dateb=&owner=include&count=100&output=atom"
    tags: ["filings", "sec"]
    enabled: true
    headers:
      User-Agent: "SENTRY-fleet williepowen@gmail.com"
    include_types:
      # Material events
      - "8-K"
      - "8-K/A"
      # Periodic reports
      - "10-Q"
      - "10-K"
      - "20-F"
      # Late-filing notices (often a stress signal)
      - "NT 10-K"
      - "NT 10-Q"
      # Securities offerings
      - "S-1"
      - "S-1/A"
      # Activist / control disclosures (5%+ with intent to influence)
      - "SCHEDULE 13D"
      - "SCHEDULE 13D/A"
      # Foreign private issuer disclosures
      - "6-K"
      # Proxy / annual meeting (for activism context)
      - "DEF 14A"
    # CIK whitelist: filings whose link's CIK matches get auto-tagged with
    # #watched + #<label>. Leading zeros are tolerated.
    # Lookup: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=<TICKER>
    cik_watchlist:
      # Already-seeded
      "1175796": "OZK"          # Bank OZK
      # Tier 1 — REGINALD live bank puts (POSITIONS.md, 2026-05-09)
      "1212545": "WAL"          # Western Alliance Bancorporation
      "49196":   "HBAN"         # Huntington Bancshares
      "1050441": "EGBN"         # Eagle Bancorp
      "35527":   "FITB"         # Fifth Third Bancorp
      "910073":  "FLG"          # Flagstar Financial (formerly NYCB; CIK predates rebrand)
      "764038":  "SSB"          # SouthState Corp
      "109380":  "ZION"         # Zions Bancorporation
      # Tier 2 — REGINALD active peer cluster (research-tracked, no live put)
      "759944":  "CFG"          # Citizens Financial Group
      "91576":   "KEY"          # KeyCorp
      "36270":   "MTB"          # M&T Bank
      "713676":  "PNC"          # PNC Financial Services
      "1281761": "RF"           # Regions Financial
      # Tier 3 — REGINALD credit/PE puts
      "1858681": "APO"          # Apollo Global Management
      "1176948": "ARES"         # Ares Management
      # Add as fleet positions evolve. CIK lookup:
      #   https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=<TICKER>
      # Or pull the canonical ticker→CIK map:
      #   https://www.sec.gov/files/company_tickers.json

