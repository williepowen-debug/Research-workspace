name: SENTRY Feed Fetch

on:
  # Scheduled runs disabled 2026-06-02 by Will/Prome.
  # Reason: twice-daily auto-commits were creating repo push friction while SENTRY
  # had not produced enough briefing value to justify pushing directly to master.
  # Re-enable only after SENTRY proves on-demand value or changes to a lower-friction
  # design (e.g. commit only #watched items, branch/artifact output, or manual briefs).
  workflow_dispatch:  # Allow manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for the "Commit and push" step to push back

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r scripts/requirements.txt
    
    - name: Fetch feeds
      run: |
        python3 scripts/fetch_feeds.py
    
    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add SIGNALS/inbound.md SIGNALS/seen.json
        git diff --cached --quiet || git commit -m "SENTRY: feed update $(date -u +%Y-%m-%d-%H%M)"
        git push
